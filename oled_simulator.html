<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COMPAS - Instrumento de Orientación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #EAE3D5;
      color: #2B2A27;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 1rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    body.dark-mode {
      background-color: #0E1A15;
      color: #E8E2D5;
    }

    /* 
      Instrumento de Orientación Cartográfico (256x256 píxeles):
      Optimizado para 60 FPS estables sin saturar el procesador del móvil.
    */
    #oledCanvas {
      width: 270px;
      height: 270px;
      background-color: #F4EFE6;
      display: block;
      border-radius: 4px;
      border: 1px solid #CFC6B4;
      box-shadow: 0 8px 30px rgba(43, 42, 39, 0.10);
      touch-action: none;
      -webkit-touch-callout: none;
      user-select: none;
      cursor: pointer;
      transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    body.dark-mode #oledCanvas {
      background-color: #13221C;
      border-color: #273E34;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    }

    /* Telemetría minimalista centrada en la parte inferior */
    .telemetry {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      font-weight: 400;
      color: #2B2A27;
      line-height: 1.6;
      letter-spacing: -0.01em;
      text-align: center;
      white-space: nowrap;
      width: max-content;
      max-width: 90vw;
      user-select: none;
      transition: color 0.25s ease;
    }

    body.dark-mode .telemetry {
      color: #E8E2D5;
    }

    .telemetry-btn {
      text-decoration: underline;
      cursor: pointer;
      padding: 4px 6px;
    }
  </style>
</head>
<body>

  <!-- Pantalla simulada (256x256 píxeles) -->
  <canvas id="oledCanvas" width="256" height="256"></canvas>

  <!-- Telemetría centrada en la parte inferior -->

    <div>lon : <span id="vLon">--</span></div>
    <div>precisión : <span id="vAcc">--</span></div>
    <div>rumbo : <span id="vHeading">--</span></div>
    <div>inclinación : <span id="vTilt">--</span></div>
    <div>calle : <span id="vCurrentStreet">--</span></div>
    <div>zona : <span id="vZone">CONECTANDO GPS...</span></div>
    <div>mapa : <span id="vMapStatus" onclick="forceRefreshMap()" ontouchstart="forceRefreshMap()" style="cursor:pointer; text-decoration:underline;">esperando ubicación...</span> <span style="opacity:0.55; font-size:10px;">(mantén presionado / desliza abajo)</span></div>

    function normalizeDistrictName(name) {
      if (!name) return "";
      return name
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/\bst\b/g, "sant")
        .replace(/[^a-z0-9]/g, "");
    }

    function getDistrictColor(districtKeyOrName, themeKey) {
      const norm = normalizeDistrictName(districtKeyOrName);
      const entry = DISTRICT_COLORS[norm];
      if (entry) {
        return themeKey === 'dark' ? entry.dark : entry.light;
      }
      return themeKey === 'dark' ? DISTRICT_FALLBACK_COLOR.dark : DISTRICT_FALLBACK_COLOR.light;
    }

    let currentThemeKey = 'light';
    try {
      const savedTheme = localStorage.getItem('compas_theme');
      if (savedTheme === 'dark' || savedTheme === 'light') {
        currentThemeKey = savedTheme;
      }
    } catch(e) {}

    function applyTheme(themeKey) {
      currentThemeKey = themeKey;
      try {
        localStorage.setItem('compas_theme', themeKey);
      } catch(e) {}
      if (themeKey === 'dark') {
        document.body.classList.add('dark-mode');
      } else {
        document.body.classList.remove('dark-mode');
      }
    }

    function toggleTheme() {
      const nextTheme = currentThemeKey === 'light' ? 'dark' : 'light';
      applyTheme(nextTheme);
    }

    if (currentThemeKey === 'dark') {
      document.body.classList.add('dark-mode');

    function drawBadge(ctx, x, y, w, h, r, bgColor, borderColor) {
      ctx.beginPath();
      if (typeof ctx.roundRect === 'function') {
        ctx.roundRect(x, y, w, h, r);
      } else {
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }
      ctx.fillStyle = bgColor;
      ctx.fill();
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

        if (!raw) return null;
        const data = JSON.parse(raw);
        const dLat = (data.lat - lat) * 111132;
        const dLon = (data.lon - lon) * 83362;
        if (Math.hypot(dLat, dLon) < 600 && data.segments && data.segments.length >= 700) {
          return data.segments;
        }
      } catch(e) {}
      return null;

      if (MAP_ORIGIN_LAT === null) return { x: 0, y: 0 };
      return {
        x: (lon - MAP_ORIGIN_LON) * METERS_PER_DEG_LON,
        y: (lat - MAP_ORIGIN_LAT) * METERS_PER_DEG_LAT

      if (!name) return false;

    function formatStreetName(rawName) {

        .replace(/^PASEO DE |^PASEO /, "PG. ")
        .replace(/^RONDA DE |^RONDA /, "RDA. ")
        .replace(/^PLAÇA DE |^PLAÇA DEL |^PLAÇA D'|^PLAÇA |^PLAZA DE |^PLAZA /, "PL. ")
        .trim();
      if (name.length > 25) name = name.substring(0, 25);
      return name;

    function getBarcelonaDistrictAndBarri(lat, lon) {
      if (lat < 41.30 || lat > 41.48 || lon < 2.05 || lon > 2.25) {
        return null;
      }
      let best = null;
      let minD2 = Infinity;
      const cosLat = Math.cos(lat * Math.PI / 180.0);
      for (let i = 0; i < BARCELONA_BARRIS.length; i++) {
        const b = BARCELONA_BARRIS[i];
        const dLat = b.lat - lat;
        const dLon = (b.lon - lon) * cosLat;
        const d2 = dLat * dLat + dLon * dLon;
        if (d2 < minD2) {
          minD2 = d2;
          best = b;
        }
      }
      return best;
    }

    function getBarcelonaDistrictKey(lat, lon) {
      if (lat < 41.30 || lat > 41.48 || lon < 2.05 || lon > 2.25) {
        return null;
      }
      const bcn = getBarcelonaDistrictAndBarri(lat, lon);
      return bcn ? normalizeDistrictName(bcn.dist) : null;
    }

      { key: 'ciutatvella',       name: 'CIUTAT VELLA',       lat: 41.38193, lon: 2.17917 },
      { key: 'eixample',          name: 'EIXAMPLE',          lat: 41.39058, lon: 2.16390 },
      { key: 'santsmontjuic',     name: 'SANTS-MONTJUÏC',     lat: 41.36889, lon: 2.14233 },
      { key: 'lescorts',          name: 'LES CORTS',          lat: 41.38650, lon: 2.11800 },
      { key: 'sarriasantgervasi', name: 'SARRIÀ-SANT GERVASI',lat: 41.40100, lon: 2.12100 },
      { key: 'gracia',            name: 'GRÀCIA',             lat: 41.41000, lon: 2.15600 },
      { key: 'hortaguinardo',     name: 'HORTA-GUINARDÓ',     lat: 41.42395, lon: 2.15655 },
      { key: 'noubarris',         name: 'NOU BARRIS',         lat: 41.44262, lon: 2.17646 },
      { key: 'santandreu',        name: 'SANT ANDREU',        lat: 41.43343, lon: 2.19157 },
      { key: 'santmarti',         name: 'SANT MARTÍ',         lat: 41.40870, lon: 2.19880 }
    ];

    function splitDistrictNameToLines(name) {
      if (!name) return [];
      if (name.length <= 15) return [name];
      if (name === "SARRIÀ-SANT GERVASI") return ["SARRIÀ-", "SANT GERVASI"];
      if (name.includes("-")) {
        const parts = name.split("-");
        if (parts.length === 2) return [parts[0] + "-", parts[1]];
      }
      return [name];
    }

    function splitStreetNameToLines(name) {
      if (!name) return [];
      if (name.length <= 13) {
        return [name];
      }

      const words = name.split(/\s+/).filter(w => w.length > 0);
      if (words.length <= 1) {
        const mid = Math.ceil(name.length / 2);
        return [name.substring(0, mid) + '-', name.substring(mid)];
      }

      let bestSplit = [words[0], words.slice(1).join(' ')];
      let minScore = 999;

      for (let i = 1; i < words.length; i++) {
        const l1 = words.slice(0, i).join(' ');
        const l2 = words.slice(i).join(' ');
        const maxLen = Math.max(l1.length, l2.length);
        const diff = Math.abs(l1.length - l2.length);
        const penalty = maxLen > 13 ? (maxLen - 13) * 6 : 0;
        const score = diff + penalty;

        if (score < minScore) {
          minScore = score;
          bestSplit = [l1, l2];
        }
      }

      return bestSplit;
    }

    async function reverseGeocodeRealLocation(lat, lon) {
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`;
        const resp = await fetch(url, { headers: { 'Accept-Language': 'es,ca' } });
        if (!resp.ok) return;
        const data = await resp.json();
        
        if (data && data.address) {
          const addr = data.address;
          const road = addr.road || addr.pedestrian || addr.footway || addr.path || "TU UBICACIÓN";
          
          window.compasState.currentStreet = road.toUpperCase();
          vCurrentStreet.textContent = road;

          const bcn = getBarcelonaDistrictAndBarri(lat, lon);
          if (bcn) {
            const zoneText = `${bcn.dist} | ${bcn.barri}`;
            window.compasState.districtNeighborhood = zoneText;
            window.compasState.currentDistrict = bcn.dist;
            window.compasState.currentDistrictKey = normalizeDistrictName(bcn.dist);
            vZone.textContent = zoneText;
          } else {
            let district = addr.city_district || addr.suburb || addr.borough || addr.county || addr.city || "UBICACIÓN REAL";
            let neighborhood = addr.neighbourhood || addr.quarter || addr.residential || "";
            if (!neighborhood && addr.suburb && addr.suburb !== district) {
              neighborhood = addr.suburb;
            }

            let zoneText = (neighborhood && neighborhood !== district) ? `${district} | ${neighborhood}` : `${district}`;
            zoneText = zoneText.toUpperCase();
            if (zoneText.length > 34) zoneText = zoneText.substring(0, 34);

            window.compasState.districtNeighborhood = zoneText;
            window.compasState.currentDistrict = district;
            window.compasState.currentDistrictKey = normalizeDistrictName(district);
            vZone.textContent = zoneText;
          }
        }
      } catch (err) {
        console.warn("Geocodificación inversa no disponible:", err);
      }
    }

    let bcnMasterData = null;
    let bcnTopographyData = null;
    let activeTopographyLines = [];
    let lastSlicedLat = null;
    let lastSlicedLon = null;
    let lastTopoSlicedLat = null;
    let lastTopoSlicedLon = null;

    function isInsideBarcelonaArea(lat, lon) {
      return (lat >= 41.30 && lat <= 41.48 && lon >= 2.05 && lon <= 2.25);
    }

    const MAJOR_20M_RANGES = [
      128,270, 389,456, 533,566, 637,657, 722,738, 793,814, 895,914, 973,995,
      1063,1090, 1149,1164, 1210,1224, 1269,1280, 1329,1346, 1397,1407, 1444,1455,
      1476,1479, 1493,1501, 1532,1546, 1581,1591, 1622,1631, 1662,1670, 1694,1698,
      1714,1719, 1737,1741, 1752,1752, 1756,1756
    ];

    function isMajorContourLine(idx) {
      for (let r = 0; r < MAJOR_20M_RANGES.length; r += 2) {
        if (idx >= MAJOR_20M_RANGES[r] && idx <= MAJOR_20M_RANGES[r + 1]) return true;
      }
      return false;
    }

    // ==========================================
    // PROCESAMIENTO VECTORIAL DE LÍNEAS TOPOGRÁFICAS
    // Convierte todo el relieve de Barcelona a coordenadas métricas relativas al origen
    // Sin recortar en círculo: abarca toda la ciudad, Collserola y Montjuïc sin límites artificiales
    // ==========================================
    function sliceTopographyFromMaster(lat, lon) {
      if (!bcnTopographyData || !originInitialized) return;

      const lines = bcnTopographyData;
      const processed = [];
      const mPerDegLat = METERS_PER_DEG_LAT;
      const mPerDegLon = METERS_PER_DEG_LON;

      for (let i = 0; i < lines.length; i++) {
        const poly = lines[i];
        if (!poly || poly.length < 2) continue;

        const count = poly.length;
        const pts = new Int32Array(count * 2);
        let minX = 999999, maxX = -999999, minY = 999999, maxY = -999999;

        for (let j = 0; j < count; j++) {
          const pt = poly[j];
          const x = Math.round((pt[1] - MAP_ORIGIN_LON) * mPerDegLon);
          const y = Math.round((pt[0] - MAP_ORIGIN_LAT) * mPerDegLat);
          pts[j * 2] = x;
          pts[j * 2 + 1] = y;

          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }

        processed.push({
          pts,
          count,
          minX, maxX, minY, maxY,
          isMajor: isMajorContourLine(i),
          id: i
        });
      }

      activeTopographyLines = processed;
      lastTopoSlicedLat = lat;
      lastTopoSlicedLon = lon;
    }

    function sliceLocalSegmentsFromMaster(lat, lon) {
      if (!bcnMasterData || !bcnMasterData.segs) return false;
      if (!originInitialized) {
        MAP_ORIGIN_LAT = lat;
        MAP_ORIGIN_LON = lon;
        METERS_PER_DEG_LON = METERS_PER_DEG_LAT * Math.cos(MAP_ORIGIN_LAT * Math.PI / 180);
        originInitialized = true;
      }

      const names = bcnMasterData.names;
      const segs = bcnMasterData.segs;
      const localSegs = [];

      // Radio de corte: 2400m para calles locales secundarias; 9500m para vías troncales principales (Diagonal, Meridiana, etc.)
      const maxSecDistM = 2400;
      const maxSecDistSq = maxSecDistM * maxSecDistM;
      const maxArterialDistM = 9500;
      const maxArterialDistSq = maxArterialDistM * maxArterialDistM;
      const mPerDegLat = METERS_PER_DEG_LAT;
      const mPerDegLon = METERS_PER_DEG_LON;

      for (let i = 0; i < segs.length; i++) {
        const s = segs[i];
        const midLat = (s[0] + s[2]) * 0.5;
        const midLon = (s[1] + s[3]) * 0.5;
        const dy = (midLat - lat) * mPerDegLat;
        const dx = (midLon - lon) * mPerDegLon;
        const rawName = names[s[4]] || "";
        const name = formatStreetName(rawName);
        const isArterial = (s[5] === 4) || isMajorArterialName(name);

        const limitM = isArterial ? maxArterialDistM : maxSecDistM;
        if (Math.abs(dy) > limitM || Math.abs(dx) > limitM) continue;

        const limitSq = isArterial ? maxArterialDistSq : maxSecDistSq;
        if (dx * dx + dy * dy <= limitSq) {
          const p1 = latLonToMeters(s[0], s[1]);
          const p2 = latLonToMeters(s[2], s[3]);
          const distKey = getBarcelonaDistrictKey(midLat, midLon);

          localSegs.push({
            x1: Math.round(p1.x),
            y1: Math.round(p1.y),
            x2: Math.round(p2.x),
            y2: Math.round(p2.y),
            name: name,
            isMajor: isArterial,
            districtKey: distKey,
            opacity: 1.0
          });
        }
      }

      if (localSegs.length > 10) {
        mapSegments = localSegs;
        lastSlicedLat = lat;
        lastSlicedLon = lon;
        if (bcnTopographyData) {
          sliceTopographyFromMaster(lat, lon);
        }
        vMapStatus.textContent = `${mapSegments.length} calles (Barcelona Vectorial)`;
        return true;
      }
      return false;
    }

    async function loadBarcelonaMasterIfAvailable(lat, lon) {
      if (!isInsideBarcelonaArea(lat, lon)) return false;
      try {
        if (!bcnMasterData) {
          vMapStatus.textContent = "cargando vector barcelona...";
          const resp = await fetch(`barcelona_complete.json?v=${Date.now()}`);
          if (resp.ok) {
            bcnMasterData = await resp.json();
          }
        }
        if (!bcnTopographyData) {
          fetch(`barcelona_topography.json?v=${Date.now()}`)
            .then(r => r.ok ? r.json() : null)
            .then(data => {
              if (data) {
                bcnTopographyData = data;
                if (window.compasState.userLat !== null) {
                  sliceTopographyFromMaster(window.compasState.userLat, window.compasState.userLon);
                }
              }
            })
            .catch(e => console.warn("Topografía no disponible:", e));
        }
        if (bcnMasterData) {
          return sliceLocalSegmentsFromMaster(lat, lon);
        }
      } catch(e) {
        console.warn("Error cargando base completa de Barcelona:", e);
      }
      return false;
    }

    const OVERPASS_MIRRORS = [
      "https://overpass.kumi.systems/api/interpreter",
      "https://overpass-api.de/api/interpreter",
      "https://lz4.overpass-api.de/api/interpreter",
      "https://overpass.private.coffee/api/interpreter"
    ];

    async function fetchRealStreetsForLocation(lat, lon) {
      if (isFetchingStreets) return;
      isFetchingStreets = true;
      if (mapSegments.length === 0) {
        vMapStatus.textContent = "descargando calles reales...";
      }

      const dLat = 0.0076;
      const dLon = 0.0076 / Math.cos(lat * Math.PI / 180);
      const s = (lat - dLat).toFixed(5);
      const w = (lon - dLon).toFixed(5);
      const n = (lat + dLat).toFixed(5);
      const e = (lon + dLon).toFixed(5);

      const query = `[out:json][timeout:8];(way(${s},${w},${n},${e})["highway"~"^(primary|secondary|tertiary|residential|trunk)$"];);out geom;`;

      let success = false;

      for (let idx = 0; idx < OVERPASS_MIRRORS.length; idx++) {
        const mirror = OVERPASS_MIRRORS[idx];
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 6500);

          let resp = null;
          try {
            resp = await fetch(`${mirror}?data=${encodeURIComponent(query)}`, {
              method: 'GET',
              signal: controller.signal
            });
          } catch(e) {
            resp = await fetch(mirror, {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: 'data=' + encodeURIComponent(query),
              signal: controller.signal
            });
          }
          clearTimeout(timeoutId);

          if (!resp || !resp.ok) continue;
          const data = await resp.json();
          if (!data || !data.elements || data.elements.length === 0) continue;

          const newSegs = [];
          for (let k = 0; k < data.elements.length; k++) {
            const elem = data.elements[k];
            if (elem.type === 'way' && elem.geometry && elem.geometry.length >= 2) {
              const highwayType = elem.tags ? elem.tags.highway : "";
              const rawName = elem.tags && elem.tags.name ? elem.tags.name : "";
              const name = formatStreetName(rawName);
              const isArterial = (highwayType === "primary" || highwayType === "trunk" || highwayType === "motorway") || isMajorArterialName(name);

              const pts = elem.geometry.map(p => latLonToMeters(p.lat, p.lon));
              for (let i = 0; i < pts.length - 1; i++) {
                const x1 = Math.round(pts[i].x);
                const y1 = Math.round(pts[i].y);
                const x2 = Math.round(pts[i + 1].x);
                const y2 = Math.round(pts[i + 1].y);
                const midLat = (elem.geometry[i].lat + elem.geometry[i + 1].lat) * 0.5;
                const midLon = (elem.geometry[i].lon + elem.geometry[i + 1].lon) * 0.5;
                const distKey = getBarcelonaDistrictKey(midLat, midLon);

                newSegs.push({
                  x1, y1, x2, y2,
                  name,
                  isMajor: isArterial,
                  districtKey: distKey,
                  opacity: 1.0
                });
              }
            }
            if (newSegs.length >= 1100) break;
          }

          if (newSegs.length > 5) {
            mapSegments = newSegs;
            saveMapCache(lat, lon, newSegs);
            vMapStatus.textContent = `${mapSegments.length} calles reales`;
            success = true;
            break;
          }
        } catch (err) {
          console.warn("Mirror falló:", mirror);
        }
      }

      if (!success && mapSegments.length === 0) {
        const loadedMaster = await loadBarcelonaMasterIfAvailable(lat, lon);
        if (!loadedMaster) {
          vMapStatus.textContent = "reintentando mapa...";
          setTimeout(() => { isFetchingStreets = false; fetchRealStreetsForLocation(lat, lon); }, 5000);
        } else {
          isFetchingStreets = false;
        }
      } else {
        isFetchingStreets = false;
      }
    }

    async function forceRefreshMap() {
      try {
        localStorage.removeItem('compas_map_v6_districts');
      } catch(e) {}
      if (window.compasState.userLat !== null) {
        const lat = window.compasState.userLat;
        const lon = window.compasState.userLon;
        if (isInsideBarcelonaArea(lat, lon)) {
          vMapStatus.textContent = "recargando barcelona...";
          bcnMasterData = null;
          bcnTopographyData = null;
          activeTopographyLines = [];
          await loadBarcelonaMasterIfAvailable(lat, lon);
        } else {
          vMapStatus.textContent = "recargando mapa amplio...";
          fetchRealStreetsForLocation(lat, lon);
        }
      }
    }

    // ==========================================
    // MOTOR DE RENDERIZADO CARTOGRÁFICO
    // Enfoque "Silencio Cartográfico": Calidez táctil, codificación vial por distritos y 60 FPS
    // ==========================================
    function renderOLED() {
      const theme = THEMES[currentThemeKey];

      // 1. Limpiar pantalla con el fondo cartográfico del tema actual
      ctx.fillStyle = theme.mapBg;
      ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);

      // Si aún no hay GPS ni mapa, mostrar radar cartográfico limpio
      if (!originInitialized || mapSegments.length === 0) {
        ctx.strokeStyle = getDistrictColor(null, currentThemeKey);
        ctx.lineWidth = 1;
        ctx.beginPath();
        const pulse = (Date.now() / 25) % 65;
        ctx.arc(CENTER_X, CENTER_Y, pulse, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = theme.uiText;
        ctx.font = '500 9px "IBM Plex Mono", monospace';
        ctx.textAlign = 'center';
        ctx.fillText("BUSCANDO GPS...", CENTER_X, CENTER_Y + 18);
        
        ctx.fillStyle = theme.userMarker;
        ctx.beginPath();
        ctx.arc(CENTER_X, CENTER_Y, 3, 0, Math.PI * 2);
        ctx.fill();

        requestAnimationFrame(renderOLED);
        return;
      }

      // Parámetros de orientación Heading-Up
      const radHeading = (window.compasState.heading * Math.PI) / 180.0;
      const cosH = Math.cos(radHeading);
      const sinH = Math.sin(radHeading);

      const uX = window.compasState.userX;
      const uY = window.compasState.userY;

      // Interpolación suave del Zoom Out con Slider Vertical continuo
      let targetMeters = VIEW_METERS_NORMAL;
      let targetDragRatio = 0.0;

      if (isPressing) {
        targetDragRatio = Math.min(1.0, currentDragY / 160.0);
        targetMeters = VIEW_METERS_PEEK + targetDragRatio * (VIEW_METERS_MAX - VIEW_METERS_PEEK);
      }

      smoothViewMeters += (targetMeters - smoothViewMeters) * 0.16;
      smoothDragRatio += (targetDragRatio - smoothDragRatio) * 0.16;
      if (Math.abs(targetMeters - smoothViewMeters) < 0.2) smoothViewMeters = targetMeters;

      const currentViewMeters = smoothViewMeters;
      const currentPixelsPerMeter = SCREEN_W / currentViewMeters;
      const cullingRadius = (currentViewMeters / 2.0) * 1.45;

      // 1.5. CAPA 0: LÍNEAS TOPOGRÁFICAS (Curvas de nivel en fondo, adaptadas dinámicamente según nivel de zoom)
      if (activeTopographyLines.length > 0) {
        ctx.save();
        ctx.strokeStyle = theme.topoLine;
        ctx.lineWidth = (smoothViewMeters > 2000) ? 1.1 : (smoothViewMeters > 700 ? 0.9 : 0.75);
        ctx.beginPath();

        // Nivel de detalle (LOD) dinámico para curvas de nivel:
        // - Cercana (<= 600m): Todas las curvas (intervalo 5m denso, paso 1)
        // - Media (600m - 1800m): Curvas maestras 20m + intermedias alternadas (paso 1)
        // - Alejada (1800m - 5000m): SÓLO curvas maestras de 20m (paso 2)
        // - Gran Zoom Alejado (> 5000m): Curvas maestras de 20m con paso 3
        const isFarZoom = smoothViewMeters > 5000;
        const isMidZoom = smoothViewMeters > 1800;
        const isTransition = smoothViewMeters > 600;
        const pointStep = isFarZoom ? 3 : (isMidZoom ? 2 : 1);

        for (let t = 0; t < activeTopographyLines.length; t++) {
          const line = activeTopographyLines[t];

          // Filtrar según zoom LOD
          if (isFarZoom) {
            if (!line.isMajor || line.count < 6) continue;
          } else if (isMidZoom) {
            if (!line.isMajor) continue;
          } else if (isTransition) {
            if (!line.isMajor && (line.id % 2 !== 0)) continue;
          }

          // Descarte rápido fuera del campo de visión (Culling O(1) con bounding box)
          const dxMin = line.minX - uX;
          const dxMax = line.maxX - uX;
          const dyMin = line.minY - uY;
          const dyMax = line.maxY - uY;

          if (dxMax < -cullingRadius || dxMin > cullingRadius ||
              dyMax < -cullingRadius || dyMin > cullingRadius) {
            continue;
          }

          const pts = line.pts;
          const count = line.count;

          for (let p = 0; p < count; p += pointStep) {
            const mx = pts[p * 2];
            const my = pts[p * 2 + 1];
            const dx = mx - uX;
            const dy = my - uY;

            const rx = dx * cosH - dy * sinH;
            const ry = dx * sinH + dy * cosH;

            const sx = Math.round(CENTER_X + rx * currentPixelsPerMeter);
            const sy = Math.round(CENTER_Y - ry * currentPixelsPerMeter);

            if (p === 0) {
              ctx.moveTo(sx, sy);
            } else {
              ctx.lineTo(sx, sy);
            }
          }

          // Asegurar conexión del punto final si el paso no cayó en el último índice
          if ((count - 1) % pointStep !== 0) {
            const lastIdx = (count - 1) * 2;
            const mx = pts[lastIdx];
            const my = pts[lastIdx + 1];
            const dx = mx - uX;
            const dy = my - uY;
            const rx = dx * cosH - dy * sinH;
            const ry = dx * sinH + dy * cosH;
            const sx = Math.round(CENTER_X + rx * currentPixelsPerMeter);
            const sy = Math.round(CENTER_Y - ry * currentPixelsPerMeter);
            ctx.lineTo(sx, sy);
          }
        }
        ctx.stroke();
        ctx.restore();
      }

      // 2. CAPA 1: RED VIAL (Color por distrito, grosor por jerarquía, opacidad preparada)
      const districtBatches = {};
      const majorCandidates = [];
      const minorCandidates = [];

      for (let i = 0; i < mapSegments.length; i++) {
        const seg = mapSegments[i];

        const dx1 = seg.x1 - uX;
        const dy1 = seg.y1 - uY;
        const dx2 = seg.x2 - uX;
        const dy2 = seg.y2 - uY;

        // Descarte rápido fuera del campo de visión dinámico (Culling)
        if ((dx1 < -cullingRadius && dx2 < -cullingRadius) ||
            (dx1 >  cullingRadius && dx2 >  cullingRadius) ||
            (dy1 < -cullingRadius && dy2 < -cullingRadius) ||
            (dy1 >  cullingRadius && dy2 >  cullingRadius)) {
          continue;
        }

        // Rotación 2D Heading-Up:
        const rx1 = dx1 * cosH - dy1 * sinH;
        const ry1 = dx1 * sinH + dy1 * cosH;
        const rx2 = dx2 * cosH - dy2 * sinH;
        const ry2 = dx2 * sinH + dy2 * cosH;

        // Proyección a pantalla 256x256 con escala adaptativa
        const sx1 = Math.round(CENTER_X + rx1 * currentPixelsPerMeter);
        const sy1 = Math.round(CENTER_Y - ry1 * currentPixelsPerMeter);
        const sx2 = Math.round(CENTER_X + rx2 * currentPixelsPerMeter);
        const sy2 = Math.round(CENTER_Y - ry2 * currentPixelsPerMeter);

        const isMajor = !!seg.isMajor;
        const distKey = seg.districtKey || 'fallback';
        const op = (typeof seg.opacity === 'number') ? seg.opacity : 1.0;

        if (!districtBatches[distKey]) {
          districtBatches[distKey] = {
            sec: [],
            pri: [],
            color: getDistrictColor(distKey, currentThemeKey),
            opacity: op
          };
        }

        const batch = districtBatches[distKey];
        if (isMajor) {
          batch.pri.push(sx1, sy1, sx2, sy2);
        } else {
          batch.sec.push(sx1, sy1, sx2, sy2);
        }

        // Candidatos con nombre para etiquetas flotantes de calles (principales y secundarias separadas)
        if (seg.name && seg.name.length > 1) {
          const mx = (sx1 + sx2) / 2;
          const my = (sy1 + sy2) / 2;
          if (mx >= 35 && mx <= SCREEN_W - 35 && my >= 36 && my <= SCREEN_H - 24) {
            if (isMajor && majorCandidates.length < 8) {
              majorCandidates.push({
                name: seg.name,
                mx, my,
                isMajor: true,
                districtKey: distKey
              });
            } else if (!isMajor && minorCandidates.length < 8) {
              minorCandidates.push({
                name: seg.name,
                mx, my,
                isMajor: false,
                districtKey: distKey
              });
            }
          }
        }
      }

      // =========================================================================
      // ARQUITECTURA DE 3 CAPAS SEMÁNTICAS POR NIVEL DE ZOOM:
      // 1. ZONA CERCANA  (<= 500m): Todas las calles (pequeñas y principales) + todas sus etiquetas
      // 2. ZONA MEDIA    (500m - 1400m): Todas las calles (incluyendo pequeñas) + SÓLO etiquetas principales
      // 3. ZONA ALEJADA  (> 1400m): Se ocultan calles pequeñas + SÓLO etiquetas de distritos
      // =========================================================================

      // A) VISIBILIDAD DE CALLES SECUNDARIAS / PEQUEÑAS:
      // Visibles al 100% en Zona Cercana y Zona Media (< 1300m).
      // Se ocultan suavemente al entrar en Zona Alejada (> 1300m - 1600m).
      const secStreetOpacity = Math.max(0, Math.min(1.0, 1.0 - (smoothViewMeters - 1300) / 300));
      if (secStreetOpacity > 0.02) {
        ctx.lineWidth = 1.1;
        for (const key in districtBatches) {
          const batch = districtBatches[key];
          if (batch.sec.length === 0) continue;
          ctx.save();
          ctx.strokeStyle = batch.color;
          const effAlpha = ((typeof batch.opacity === 'number') ? batch.opacity : 1.0) * secStreetOpacity;
          ctx.globalAlpha = Math.max(0.15, Math.min(1.0, effAlpha));
          ctx.beginPath();
          for (let j = 0; j < batch.sec.length; j += 4) {
            ctx.moveTo(batch.sec[j], batch.sec[j + 1]);
            ctx.lineTo(batch.sec[j + 2], batch.sec[j + 3]);
          }
          ctx.stroke();
          ctx.restore();
        }
      }

      // B) VISIBILIDAD DE VÍAS PRINCIPALES:
      // Visibles en las 3 zonas (trazo más grueso 2.4px en zonas cercana y media; 1.8px adaptativo en zona alejada)
      ctx.lineWidth = (smoothViewMeters > 1600) ? 1.8 : 2.4;
      for (const key in districtBatches) {
        const batch = districtBatches[key];
        if (batch.pri.length === 0) continue;
        ctx.save();
        ctx.strokeStyle = batch.color;
        if (batch.opacity < 0.99) ctx.globalAlpha = Math.max(0.25, Math.min(1.0, batch.opacity));
        ctx.beginPath();
        for (let j = 0; j < batch.pri.length; j += 4) {
          ctx.moveTo(batch.pri[j], batch.pri[j + 1]);
          ctx.lineTo(batch.pri[j + 2], batch.pri[j + 3]);
        }
        ctx.stroke();
        ctx.restore();
      }

      // ==========================================
      // C) ETIQUETAS DE CALLES FLOTANTES SEGÚN ZONA:
      // - Zona Cercana (< 500m): Se muestran etiquetas de calles principales y secundarias
      // - Zona Media (500m - 1400m): SÓLO se muestran etiquetas de calles principales
      // - Zona Alejada (> 1400m): Se ocultan todas las etiquetas de calles
      // ==========================================
      const minorLabelOpacity = Math.max(0, Math.min(1.0, 1.0 - (smoothViewMeters - 440) / 100));
      const majorLabelOpacity = Math.max(0, Math.min(1.0, 1.0 - (smoothViewMeters - 1350) / 250));

      if (majorLabelOpacity > 0.02 || minorLabelOpacity > 0.02) {
        ctx.save();
        ctx.font = "500 8.5px 'IBM Plex Mono', monospace";
        ctx.textBaseline = "middle";

        const drawnNames = new Set();
        const placedCenters = [];
        let labelsCount = 0;

        // Lista de candidatos priorizando vías principales
        const candidateList = [];
        for (let m = 0; m < majorCandidates.length; m++) {
          candidateList.push(majorCandidates[m]);
        }
        if (minorLabelOpacity > 0.02) {
          for (let m = 0; m < minorCandidates.length; m++) {
            candidateList.push(minorCandidates[m]);
          }
        }

        for (let k = 0; k < candidateList.length; k++) {
          const item = candidateList[k];
          if (labelsCount >= 3) break;
          if (drawnNames.has(item.name)) continue;

          // En zona media, si la etiqueta es de calle secundaria y minorLabelOpacity es 0, no mostrar
          const labelAlpha = item.isMajor ? majorLabelOpacity : minorLabelOpacity;
          if (labelAlpha <= 0.02) continue;

          let overlap = false;
          for (let p = 0; p < placedCenters.length; p++) {
            if (Math.hypot(item.mx - placedCenters[p].x, item.my - placedCenters[p].y) < 38) {
              overlap = true;
              break;
            }
          }
          if (overlap) continue;

          const lines = splitStreetNameToLines(item.name);
          const badgeBorderColor = getDistrictColor(item.districtKey, currentThemeKey);

          ctx.save();
          ctx.globalAlpha = labelAlpha;

          if (lines.length === 1) {
            const tw = ctx.measureText(lines[0]).width;
            const badgeW = Math.round(tw + 8);
            const badgeH = 14;
            const bx = Math.round(item.mx - badgeW / 2);
            const by = Math.round(item.my - badgeH / 2);

            drawBadge(ctx, bx, by, badgeW, badgeH, 2, theme.labelBg, badgeBorderColor);

            ctx.fillStyle = theme.labelText;
            ctx.textAlign = "center";
            ctx.fillText(lines[0], item.mx, item.my + 0.5);
          } else {
            const tw1 = ctx.measureText(lines[0]).width;
            const tw2 = ctx.measureText(lines[1]).width;
            const maxTw = Math.max(tw1, tw2);
            const badgeW = Math.round(maxTw + 8);
            const badgeH = 23;
            const bx = Math.round(item.mx - badgeW / 2);
            const by = Math.round(item.my - badgeH / 2);

            drawBadge(ctx, bx, by, badgeW, badgeH, 2, theme.labelBg, badgeBorderColor);

            ctx.fillStyle = theme.labelText;
            ctx.textAlign = "center";
            ctx.fillText(lines[0], item.mx, item.my - 5);
            ctx.fillText(lines[1], item.mx, item.my + 5);
          }

          ctx.restore();

          drawnNames.add(item.name);
          placedCenters.push({ x: item.mx, y: item.my });
          labelsCount++;
        }
        ctx.restore();
      }

      // ==========================================
      // D) ETIQUETAS DE DISTRITOS EN ZONA ALEJADA
      // Aparecen exclusivamente al entrar en Zona Alejada (> 1400m), con estilo cartográfico
      // Ocultas en Zona Cercana y Zona Media
      // ==========================================
      const districtOpacity = Math.min(1.0, Math.max(0, (smoothViewMeters - 1400) / 250));
      if (districtOpacity > 0.02) {
        ctx.save();
        ctx.globalAlpha = districtOpacity;
        ctx.font = "600 8px 'IBM Plex Mono', monospace";
        ctx.textBaseline = "middle";

        // Ordenar distritos por cercanía al usuario para priorizar la etiqueta local
        const sortedDistricts = BARCELONA_DISTRICT_CENTROIDS.map(d => {
          const m = latLonToMeters(d.lat, d.lon);
          const dx = m.x - uX;
          const dy = m.y - uY;
          return { ...d, dx, dy, d2: dx * dx + dy * dy };
        }).sort((a, b) => a.d2 - b.d2);

        const placedDistrictBoxes = [];

        for (let d = 0; d < sortedDistricts.length; d++) {
          const distObj = sortedDistricts[d];

          const rx = distObj.dx * cosH - distObj.dy * sinH;
          const ry = distObj.dx * sinH + distObj.dy * cosH;

          const sx = Math.round(CENTER_X + rx * currentPixelsPerMeter);
          const sy = Math.round(CENTER_Y - ry * currentPixelsPerMeter);

          const lines = splitDistrictNameToLines(distObj.name);
          const badgeBorderColor = getDistrictColor(distObj.key, currentThemeKey);

          let badgeW = 0;
          let badgeH = 0;

          if (lines.length === 1) {
            const tw = ctx.measureText(lines[0]).width;
            badgeW = Math.round(tw + 8);
            badgeH = 13;
          } else {
            const tw1 = ctx.measureText(lines[0]).width;
            const tw2 = ctx.measureText(lines[1]).width;
            const maxTw = Math.max(tw1, tw2);
            badgeW = Math.round(maxTw + 8);
            badgeH = 20;
          }

          const bx = Math.round(sx - badgeW / 2);
          const by = Math.round(sy - badgeH / 2);

          // Verificar límites del viewport (evitando solapar con la barra superior de 22px y la escala inferior)
          if (bx < 2 || bx + badgeW > SCREEN_W - 2 || by < 24 || by + badgeH > SCREEN_H - 10) {
            continue;
          }

          // Evitar colisión entre etiquetas de distritos (AABB exacto)
          let collides = false;
          for (let p = 0; p < placedDistrictBoxes.length; p++) {
            const b = placedDistrictBoxes[p];
            if (!(bx + badgeW < b.bx || bx > b.bx + b.badgeW || by + badgeH < b.by || by > b.by + b.badgeH)) {
              collides = true;
              break;
            }
          }
          if (collides) continue;

          // Dibujar insignia (badge)
          drawBadge(ctx, bx, by, badgeW, badgeH, 2, theme.labelBg, badgeBorderColor);

          ctx.fillStyle = theme.labelText;
          ctx.textAlign = "center";

          if (lines.length === 1) {
            ctx.fillText(lines[0], sx, sy + 0.5);
          } else {
            ctx.fillText(lines[0], sx, sy - 4.5);
            ctx.fillText(lines[1], sx, sy + 4.5);
          }

          placedDistrictBoxes.push({ bx, by, badgeW, badgeH });
        }
        ctx.restore();
      }

      // 4. HUD SUPERIOR: ENCABEZADO "DISTRITO | BARRIO" + PUNTO 7PX DEL DISTRITO + BOTÓN SOL/LUNA
      ctx.fillStyle = theme.headerBg;
      ctx.fillRect(0, 0, SCREEN_W, 22);
      ctx.strokeStyle = theme.headerBorder;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, 22.5);
      ctx.lineTo(SCREEN_W, 22.5);
      ctx.stroke();

      // Botón minimalista de alternancia de modo con ícono de sol / luna (trazo fino 1.5px, sin relleno)
      ctx.save();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = theme.uiText;
      if (currentThemeKey === "light") {
        ctx.beginPath();
        ctx.arc(12, 11, 4.2, -0.6 * Math.PI, 0.8 * Math.PI, false);
        ctx.quadraticCurveTo(11.2, 11, 12 + 4.2 * Math.cos(-0.6 * Math.PI), 11 + 4.2 * Math.sin(-0.6 * Math.PI));
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(12, 11, 2.5, 0, Math.PI * 2);
        for (let a = 0; a < 8; a++) {
          const ang = (a * Math.PI) / 4;
          const ca = Math.cos(ang), sa = Math.sin(ang);
          ctx.moveTo(12 + ca * 4.2, 11 + sa * 4.2);
          ctx.lineTo(12 + ca * 5.8, 11 + sa * 5.8);
        }
        ctx.stroke();
      }
      ctx.restore();

      // Encabezado con punto de 7px del color del distrito + texto en mayúsculas
      ctx.save();
      const zoneStr = (window.compasState.districtNeighborhood || "UBICACIÓN REAL").toUpperCase();
      const currentDistKey = window.compasState.currentDistrictKey || null;
      const currentDistColor = getDistrictColor(currentDistKey, currentThemeKey);

      if ("letterSpacing" in ctx) ctx.letterSpacing = "0.08em";
      if (zoneStr.length > 25) {
        ctx.font = "600 8.5px 'IBM Plex Mono', monospace";
      } else {
        ctx.font = "600 9.5px 'IBM Plex Mono', monospace";
      }

      const tw = ctx.measureText(zoneStr).width;
      const dotDiameter = 7;
      const dotRadius = 3.5;
      const gap = 6;
      const totalHeaderWidth = dotDiameter + gap + tw;

      let headerStartX = Math.round(CENTER_X - totalHeaderWidth / 2);
      if (headerStartX < 28) headerStartX = 28;

      const dotCenterX = headerStartX + dotRadius;
      const textStartX = headerStartX + dotDiameter + gap;

      // Punto circular de 7px con el color del distrito actual (dinámico al cambiar de zona o modo)
      ctx.fillStyle = currentDistColor;
      ctx.beginPath();
      ctx.arc(dotCenterX, 11.5, dotRadius, 0, Math.PI * 2);
      ctx.fill();

      // Nombre del distrito / barrio
      ctx.fillStyle = theme.uiText;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(zoneStr, textStartX, 11.5);
      ctx.restore();

      // 5. MARCADOR DE POSICIÓN DEL USUARIO (Centro 128, 128)
      // Único acento cromático del mapa base: bermellón (#D1493B / #E85D4A) con halo de protección
      ctx.save();
      ctx.fillStyle = theme.mapBg;
      ctx.beginPath();
      ctx.arc(CENTER_X, CENTER_Y, 7.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = theme.userMarker;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(CENTER_X, CENTER_Y, 6, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = theme.userMarker;
      ctx.beginPath();
      ctx.arc(CENTER_X, CENTER_Y, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 6. INDICADOR DEL NORTE EN EL PERÍMETRO
      const northAngle = -radHeading - Math.PI / 2;
      const northRadius = 100;
      const nx = CENTER_X + Math.cos(northAngle) * northRadius;
      const ny = CENTER_Y + Math.sin(northAngle) * northRadius;

      ctx.save();
      ctx.translate(nx, ny);
      ctx.rotate(northAngle + Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(0, -6);
      ctx.lineTo(4, 5);
      ctx.lineTo(-4, 5);
      ctx.closePath();
      ctx.fillStyle = theme.uiText;
      ctx.fill();

      ctx.font = "600 8.5px 'IBM Plex Mono', monospace";
      ctx.textAlign = "center";
      ctx.fillText("N", 0, 15);
      ctx.restore();

      // 7. BARRA DE ESCALA GRÁFICA DINÁMICA (con tabular-nums)
      let scaleMeters = 50.0;
      if (currentViewMeters > 5000) {
        scaleMeters = 2000.0;
      } else if (currentViewMeters > 2000) {
        scaleMeters = 500.0;
      } else if (currentViewMeters > 950) {
        scaleMeters = 200.0;
      } else if (currentViewMeters > 380) {
        scaleMeters = 100.0;
      }
      const scaleBarPx = Math.round(scaleMeters * currentPixelsPerMeter);
      const scaleY = SCREEN_H - 10;
      ctx.strokeStyle = theme.uiText;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(12, scaleY);
      ctx.lineTo(12 + scaleBarPx, scaleY);
      ctx.moveTo(12, scaleY - 3);
      ctx.lineTo(12, scaleY + 3);
      ctx.moveTo(12 + scaleBarPx, scaleY - 3);
      ctx.lineTo(12 + scaleBarPx, scaleY + 3);
      ctx.stroke();

      ctx.fillStyle = theme.uiText;
      ctx.font = "500 8px 'IBM Plex Mono', monospace";
      ctx.textAlign = "left";
      const scaleLabel = scaleMeters >= 1000 ? `${Math.round(scaleMeters / 1000)}km` : `${Math.round(scaleMeters)}m`;
      ctx.fillText(scaleLabel, 12 + scaleBarPx + 5, scaleY + 3);

      // 8. INDICADOR VISUAL DEL SLIDER (Control vertical de zoom)
      const sliderOpacity = Math.min(1.0, Math.max(0, (smoothViewMeters - VIEW_METERS_NORMAL) / 80.0));
      if (sliderOpacity > 0.02) {
        ctx.save();
        ctx.globalAlpha = sliderOpacity;
        const trackX = SCREEN_W - 8;
        const trackTop = 40;
        const trackH = 80;
        const trackBottom = trackTop + trackH;

        ctx.strokeStyle = theme.headerBorder;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(trackX, trackTop);
        ctx.lineTo(trackX, trackBottom);
        ctx.moveTo(trackX - 3, trackTop);
        ctx.lineTo(trackX + 3, trackTop);
        ctx.moveTo(trackX - 3, trackBottom);
        ctx.lineTo(trackX + 3, trackBottom);
        ctx.stroke();

        const thumbY = trackTop + smoothDragRatio * trackH;
        ctx.fillStyle = theme.uiText;
        ctx.fillRect(trackX - 3, Math.round(thumbY - 3), 7, 7);

        ctx.font = "500 7.5px 'IBM Plex Mono', monospace";
        ctx.textAlign = "right";
        ctx.fillText(`${Math.round(smoothViewMeters)}m`, trackX - 6, Math.round(thumbY + 2.5));

        ctx.restore();
      }

      requestAnimationFrame(renderOLED);
    }

    // ==========================================
    // CAPTURA DE SENSORES (GPS + GIROSCOPIO)
    // ==========================================
    async function requestOrientationPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          btnGyro.textContent = "solicitando...";
          const response = await DeviceOrientationEvent.requestPermission();
          if (response === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
            window.compasState.gyroActive = true;
            btnGyro.textContent = "activo";
            btnGyro.style.textDecoration = "none";
            btnGyro.onclick = null;
          } else {
            btnGyro.textContent = "denegado";
            btnGyro.style.textDecoration = "none";
          }
        } catch (err) {
          console.warn("Error al solicitar orientación:", err);
          btnGyro.textContent = "error";
        }
      } else if ('ondeviceorientation' in window) {
        window.addEventListener('deviceorientation', handleOrientation, true);
        window.compasState.gyroActive = true;
        btnGyro.textContent = "activo";
        btnGyro.style.textDecoration = "none";
        btnGyro.onclick = null;
      } else {
        btnGyro.textContent = "no soportado";
        btnGyro.style.textDecoration = "none";
      }
    }

    function getCardinal(deg) {
      const directions = ["N", "NE", "E", "SE", "S", "SO", "O", "NO"];
      return directions[Math.round(deg / 45) % 8];
    }

    function handleOrientation(event) {
      let heading = null;

      if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null) {
        heading = event.webkitCompassHeading;
      } else if (event.alpha !== null) {
        heading = (360 - event.alpha) % 360;
      }

      if (heading !== null) {
        window.compasState.heading = heading;
        const card = getCardinal(heading);
        vHeading.textContent = `${Math.round(heading)}° ${card}`;
      }

      if (event.beta !== null && event.gamma !== null) {
        window.compasState.tiltBeta = event.beta;
        window.compasState.tiltGamma = event.gamma;
        const signB = event.beta >= 0 ? "+" : "";
        const signG = event.gamma >= 0 ? "+" : "";
        vTilt.textContent = `${signB}${Math.round(event.beta)}° / ${signG}${Math.round(event.gamma)}°`;
      }
    }

    function initGeolocation() {
      if (!("geolocation" in navigator)) {
        vLat.textContent = "no disponible";
        return;
      }

      navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const acc = pos.coords.accuracy;

          window.compasState.userLat = lat;
          window.compasState.userLon = lon;
          window.compasState.accuracy = acc;
          window.compasState.gpsActive = true;

          if (!originInitialized) {
            MAP_ORIGIN_LAT = lat;
            MAP_ORIGIN_LON = lon;
            METERS_PER_DEG_LON = METERS_PER_DEG_LAT * Math.cos(MAP_ORIGIN_LAT * Math.PI / 180);
            originInitialized = true;

            const isBcn = isInsideBarcelonaArea(lat, lon);
            if (isBcn) {
              loadBarcelonaMasterIfAvailable(lat, lon);
            } else {
              const cachedSegs = loadMapCache(lat, lon);
              if (cachedSegs && cachedSegs.length >= 500) {
                mapSegments = cachedSegs;
                vMapStatus.textContent = `${mapSegments.length} calles (en caché)`;
              } else {
                fetchRealStreetsForLocation(lat, lon);
              }
            }

            const bcn = getBarcelonaDistrictAndBarri(lat, lon);
            if (bcn) {
              const zoneText = `${bcn.dist} | ${bcn.barri}`;
              window.compasState.districtNeighborhood = zoneText;
              window.compasState.currentDistrict = bcn.dist;
              window.compasState.currentDistrictKey = normalizeDistrictName(bcn.dist);
              vZone.textContent = zoneText;
            }

            reverseGeocodeRealLocation(lat, lon);
          }

          const coordsInMeters = latLonToMeters(lat, lon);
          window.compasState.userX = coordsInMeters.x;
          window.compasState.userY = coordsInMeters.y;

          if (bcnMasterData && lastSlicedLat !== null) {
            const moveDist = Math.hypot((lat - lastSlicedLat) * 111132, (lon - lastSlicedLon) * 83362);
            if (moveDist > 150) {
              const bcn = getBarcelonaDistrictAndBarri(lat, lon);
              if (bcn) {
                const zoneText = `${bcn.dist} | ${bcn.barri}`;
                window.compasState.districtNeighborhood = zoneText;
                window.compasState.currentDistrict = bcn.dist;
                window.compasState.currentDistrictKey = normalizeDistrictName(bcn.dist);
                vZone.textContent = zoneText;
              }
              sliceLocalSegmentsFromMaster(lat, lon);
              if (bcnTopographyData) {
                sliceTopographyFromMaster(lat, lon);
              }
            }
          }

          vLat.textContent = lat.toFixed(6);
          vLon.textContent = lon.toFixed(6);
          vAcc.textContent = `±${Math.round(acc)} m`;
        },
        (err) => {
          console.warn("Error GPS:", err);
          vLat.textContent = "sin señal gps";
        },
        {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        }
      );
    }

    // ==========================================
    // INTERACCIÓN TÁCTIL: ZOOM Y CAMBIO DE TEMA
    // ==========================================
    function startZoom(e) {
      if (e && e.target === btnGyro) return;
      const rect = canvas.getBoundingClientRect();
      const scale = SCREEN_W / rect.width;
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      const x = (cx - rect.left) * scale;
      const y = (cy - rect.top) * scale;

      // Botón superior izquierdo: alternancia de tema claro/oscuro (zona 0-32px X, 0-24px Y)
      if (x >= 0 && x <= 32 && y >= 0 && y <= 24) {
        toggleTheme();
        return;
      }

      isPressing = true;
      touchStartY = cy;
      currentDragY = 0;
    }

    function moveZoom(e) {
      if (!isPressing) return;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      const dy = cy - touchStartY;
      currentDragY = Math.max(0, dy);
    }

    function endZoom() {
      isPressing = false;
      currentDragY = 0;
    }

    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      startZoom(e);
    }, { passive: false });

    window.addEventListener("touchmove", (e) => {
      if (isPressing) {
        moveZoom(e);
      }
    }, { passive: true });

    window.addEventListener("touchend", endZoom);
    window.addEventListener("touchcancel", endZoom);

    canvas.addEventListener("mousedown", (e) => {
      startZoom(e);
    });

    window.addEventListener("mousemove", (e) => {
      if (isPressing) {
        moveZoom(e);
      } else {
        const rect = canvas.getBoundingClientRect();
        const scale = SCREEN_W / rect.width;
        const x = (e.clientX - rect.left) * scale;
        const y = (e.clientY - rect.top) * scale;
        if (x <= 32 && y <= 24) {
          canvas.style.cursor = "pointer";
        } else {
          canvas.style.cursor = "default";
        }
      }
    });

    window.addEventListener("mouseup", endZoom);

    window.addEventListener("DOMContentLoaded", () => {
      initGeolocation();
      requestAnimationFrame(renderOLED);
    });
  </script>
</body>
