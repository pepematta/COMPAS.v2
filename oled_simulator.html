<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COMPAS - Instrumento de Orientación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #EAE3D5;
      color: #2B2A27;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 1rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    body.dark-mode {
      background-color: #0E1A15;
      color: #E8E2D5;
    }

    /* 
      Instrumento de Orientación Cartográfico (256x256 píxeles):
      Optimizado para 60 FPS estables sin saturar el procesador del móvil.
    */
    #oledCanvas {
      width: 270px;
      height: 270px;
      background-color: #F4EFE6;
      display: block;
      border-radius: 4px;
      border: 1px solid #CFC6B4;
      box-shadow: 0 8px 30px rgba(43, 42, 39, 0.10);
      touch-action: none;
      -webkit-touch-callout: none;
      user-select: none;
      cursor: pointer;
      transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    body.dark-mode #oledCanvas {
      background-color: #13221C;
      border-color: #273E34;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    }

    /* Telemetría minimalista centrada en la parte inferior */
    .telemetry {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      font-weight: 400;
      color: #2B2A27;
      line-height: 1.6;
      letter-spacing: -0.01em;
      text-align: center;
      white-space: nowrap;
      width: max-content;
      max-width: 90vw;
      user-select: none;
      transition: color 0.25s ease;
    }

    body.dark-mode .telemetry {
      color: #E8E2D5;
    }

    .telemetry-btn {
      text-decoration: underline;
      cursor: pointer;
      padding: 4px 6px;
    }
  </style>
</head>
<body>

  <!-- Pantalla simulada (256x256 píxeles) -->
  <canvas id="oledCanvas" width="256" height="256"></canvas>

    function normalizeDistrictName(name) {
      if (!name) return "";
      return name
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/\bst\b/g, "sant")
        .replace(/[^a-z0-9]/g, "");
    }

    function getDistrictColor(districtKeyOrName, themeKey) {
      const norm = normalizeDistrictName(districtKeyOrName);
      const entry = DISTRICT_COLORS[norm];
      if (entry) {
        return themeKey === 'dark' ? entry.dark : entry.light;
      }
      return themeKey === 'dark' ? DISTRICT_FALLBACK_COLOR.dark : DISTRICT_FALLBACK_COLOR.light;
    }

      const savedTheme = localStorage.getItem('compas_theme');
      if (savedTheme === 'dark' || savedTheme === 'light') {
        currentThemeKey = savedTheme;
      }
    } catch(e) {}

    function applyTheme(themeKey) {
      currentThemeKey = themeKey;
      try {
        localStorage.setItem('compas_theme', themeKey);
      } catch(e) {}
      if (themeKey === 'dark') {
        document.body.classList.add('dark-mode');
      } else {
        document.body.classList.remove('dark-mode');
      }
    }

    function toggleTheme() {
      const nextTheme = currentThemeKey === 'light' ? 'dark' : 'light';
      applyTheme(nextTheme);
    }

    function drawBadge(ctx, x, y, w, h, r, bgColor, borderColor) {
      ctx.beginPath();
      if (typeof ctx.roundRect === 'function') {
        ctx.roundRect(x, y, w, h, r);
      } else {
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }
      ctx.fillStyle = bgColor;
      ctx.fill();
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

        .replace(/^PLAÇA DE |^PLAÇA DEL |^PLAÇA D'|^PLAÇA |^PLAZA DE |^PLAZA /, "PL. ")

    function getBarcelonaDistrictAndBarri(lat, lon) {
      if (lat < 41.30 || lat > 41.48 || lon < 2.05 || lon > 2.25) {
        return null;
      }
      let best = null;
      let minD2 = Infinity;
      const cosLat = Math.cos(lat * Math.PI / 180.0);
      for (let i = 0; i < BARCELONA_BARRIS.length; i++) {
        const b = BARCELONA_BARRIS[i];
        const dLat = b.lat - lat;
        const dLon = (b.lon - lon) * cosLat;
        const d2 = dLat * dLat + dLon * dLon;
        if (d2 < minD2) {
          minD2 = d2;
          best = b;
        }
      }
      return best;
    }

    function splitDistrictNameToLines(name) {
      if (!name) return [];
      if (name.length <= 15) return [name.toUpperCase()];
      if (name === "SARRIÀ-SANT GERVASI") return ["SARRIÀ-", "SANT GERVASI"];
      if (name.includes("-")) {
        const parts = name.split("-");
        if (parts.length === 2) return [parts[0].toUpperCase() + "-", parts[1].toUpperCase()];
      }
      return [name.toUpperCase()];

    function formatBarriName(str) {
      if (!str) return "";
      const words = str.toLowerCase().split(/\s+/);
      return words.map((w, idx) => {
        if (w.includes("'")) {
          const parts = w.split("'");
          const p0 = (idx === 0 ? parts[0].charAt(0).toUpperCase() + parts[0].slice(1) : parts[0].toLowerCase());
          const p1 = parts[1].charAt(0).toUpperCase() + parts[1].slice(1);
          return p0 + "'" + p1;
        }
        if (w.includes("-")) {
          return w.split("-").map(p => p.charAt(0).toUpperCase() + p.slice(1)).join("-");
        }
        if (idx > 0 && (w === "de" || w === "del" || w === "dels" || w === "i" || w === "en" || w === "a")) {
          return w;
        }
        return w.charAt(0).toUpperCase() + w.slice(1);
      }).join(" ");
    }

    function splitBarriNameToLines(name) {
      if (!name) return [];
      if (name.length <= 16) return [name];
      if (name.includes(",")) {
        const parts = name.split(",");
        return [parts[0].trim(), parts.slice(1).join(",").trim()];
      }
      if (name.includes(" - ")) {
        const parts = name.split(" - ");
        return [parts[0].trim(), parts[1].trim()];
      }
      const words = name.split(/\s+/);
      if (words.length <= 1) return [name];
      const mid = Math.ceil(words.length / 2);
      return [words.slice(0, mid).join(" "), words.slice(mid).join(" ")];
    }

    function splitStreetNameToLines(name) {
      if (!name) return [];
      if (name.length <= 13) {
        return [name];
      }

      const words = name.split(/\s+/).filter(w => w.length > 0);
      if (words.length <= 1) {
        const mid = Math.ceil(name.length / 2);
        return [name.substring(0, mid) + '-', name.substring(mid)];
      }

      let bestSplit = [words[0], words.slice(1).join(' ')];
      let minScore = 999;

      for (let i = 1; i < words.length; i++) {
        const l1 = words.slice(0, i).join(' ');
        const l2 = words.slice(i).join(' ');
        const maxLen = Math.max(l1.length, l2.length);
        const diff = Math.abs(l1.length - l2.length);
        const penalty = maxLen > 13 ? (maxLen - 13) * 6 : 0;
        const score = diff + penalty;

        if (score < minScore) {
          minScore = score;
          bestSplit = [l1, l2];
        }
      }

      return bestSplit;
    }

    function smoothstep(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1.0, (x - edge0) / (edge1 - edge0)));
      return t * t * (3.0 - 2.0 * t);
    }

    function hexToRgb(hex) {
      if (!hex || typeof hex !== 'string') return { r: 180, g: 180, b: 180 };
      hex = hex.replace('#', '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const num = parseInt(hex, 16);
      if (isNaN(num)) return { r: 180, g: 180, b: 180 };
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function lerpColor(hexA, hexB, t) {
      if (t <= 0.001) return hexA;
      if (t >= 0.999) return hexB;
      const a = hexToRgb(hexA);
      const b = hexToRgb(hexB);
      const r = Math.round(a.r + (b.r - a.r) * t);
      const g = Math.round(a.g + (b.g - a.g) * t);
      const bl = Math.round(a.b + (b.b - a.b) * t);
      return `rgb(${r},${g},${bl})`;
    }

    /**
     * Reconciliación espacial de insignias (Anti-colisión por relajación física de fuerzas).
     * En lugar de descartar etiquetas, las separa de forma armónica a lo largo del eje
     * de mínima penetración (con preferencia vertical para etiquetas rectangulares) y
     * las restringe estrictamente dentro de los límites visibles del viewport.
     */
    function relaxLabelBoxes(boxes, bounds, iterations = 20) {
      if (!boxes || boxes.length <= 1) return;
      const pad = 3;

      for (let it = 0; it < iterations; it++) {
        let moved = false;
        for (let i = 0; i < boxes.length; i++) {
          for (let j = i + 1; j < boxes.length; j++) {
            const a = boxes[i];
            const b = boxes[j];
            const reqX = (a.w + b.w) / 2 + pad;
            const reqY = (a.h + b.h) / 2 + pad;

            let dx = a.cx - b.cx;
            let dy = a.cy - b.cy;

            if (Math.abs(dx) < 0.001 && Math.abs(dy) < 0.001) {
              dx = (i - j) * 0.1;
              dy = (i % 2 === 0 ? 1 : -1) * 0.1;
            }

            const overlapX = reqX - Math.abs(dx);
            const overlapY = reqY - Math.abs(dy);

            if (overlapX > 0 && overlapY > 0) {
              moved = true;
              const penX = overlapX / reqX;
              // Las etiquetas son bandas horizontales alargadas; la separación vertical
              // es mucho más sutil y mantiene la etiqueta más cerca de su vía.
              const penY = (overlapY / reqY) * 0.65;

              if (penY <= penX) {
                const signY = dy >= 0 ? 1 : -1;
                const shiftY = overlapY * 0.55;
                a.cy += signY * shiftY;
                b.cy -= signY * shiftY;
              } else {
                const signX = dx >= 0 ? 1 : -1;
                const shiftX = overlapX * 0.55;
                a.cx += signX * shiftX;
                b.cx -= signX * shiftX;
              }
            }
          }
        }

        // Restringir cajas dentro de los márgenes visibles del viewport
        for (let i = 0; i < boxes.length; i++) {
          const b = boxes[i];
          const halfW = b.w / 2;
          const halfH = b.h / 2;
          b.cx = Math.max(bounds.minX + halfW, Math.min(bounds.maxX - halfW, b.cx));
          b.cy = Math.max(bounds.minY + halfH, Math.min(bounds.maxY - halfH, b.cy));
        }

        if (!moved) break;
      }
    }

    const MAJOR_20M_RANGES = [

    function isMajorContourLine(idx) {
      for (let r = 0; r < MAJOR_20M_RANGES.length; r += 2) {

    // ==========================================
    // PROCESAMIENTO VECTORIAL DE LÍNEAS TOPOGRÁFICAS
    // Convierte todo el relieve de Barcelona a coordenadas métricas relativas al origen
    // Sin recortar en círculo: abarca toda la ciudad, Collserola y Montjuïc sin límites artificiales
    // ==========================================
    function sliceTopographyFromMaster(lat, lon) {
      if (!bcnTopographyData || !originInitialized) return;

      const lines = bcnTopographyData;
      const processed = [];
      const mPerDegLat = METERS_PER_DEG_LAT;
      const mPerDegLon = METERS_PER_DEG_LON;

      for (let i = 0; i < lines.length; i++) {
        const poly = lines[i];
        if (!poly || poly.length < 2) continue;

        const count = poly.length;
        const pts = new Int32Array(count * 2);
        let minX = 999999, maxX = -999999, minY = 999999, maxY = -999999;

        for (let j = 0; j < count; j++) {
          const pt = poly[j];
          const x = Math.round((pt[1] - MAP_ORIGIN_LON) * mPerDegLon);
          const y = Math.round((pt[0] - MAP_ORIGIN_LAT) * mPerDegLat);
          pts[j * 2] = x;
          pts[j * 2 + 1] = y;

          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }

        processed.push({
          pts,
          count,
          minX, maxX, minY, maxY,
          isMajor: isMajorContourLine(i),
          id: i
        });
      }

      activeTopographyLines = processed;
      lastTopoSlicedLat = lat;
      lastTopoSlicedLon = lon;
    }

    function sliceWaterFromMaster(lat, lon) {
      if (!bcnWaterData || !originInitialized) return;

      const lines = bcnWaterData;
      const processed = [];
      const mPerDegLat = METERS_PER_DEG_LAT;
      const mPerDegLon = METERS_PER_DEG_LON;

      for (let i = 0; i < lines.length; i++) {
        const poly = lines[i];
        if (!poly || poly.length < 2) continue;

        const count = poly.length;
        const pts = new Int32Array(count * 2);
        let minX = 999999, maxX = -999999, minY = 999999, maxY = -999999;

        for (let j = 0; j < count; j++) {
          const pt = poly[j];
          const x = Math.round((pt[1] - MAP_ORIGIN_LON) * mPerDegLon);
          const y = Math.round((pt[0] - MAP_ORIGIN_LAT) * mPerDegLat);
          pts[j * 2] = x;
          pts[j * 2 + 1] = y;

          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;

        }

        const isRiver = (i === 0 || i === 46 || i === 35 || i === 22 || i === 144 || i === 133 || i === 56 || i === 63 || i === 2 || i === 57 || i === 23 || i === 53 || i === 1 || i === 18 || i === 145 || i === 16 || i === 38 || i === 55 || i === 59 || i === 17 || i === 108 || i === 19);

        processed.push({

    function sliceLocalSegmentsFromMaster(lat, lon) {
      if (!bcnMasterData || !bcnMasterData.segs) return false;
      if (!originInitialized) {
        MAP_ORIGIN_LAT = lat;
        MAP_ORIGIN_LON = lon;
        METERS_PER_DEG_LON = METERS_PER_DEG_LAT * Math.cos(MAP_ORIGIN_LAT * Math.PI / 180);
        originInitialized = true;
      }

      const names = bcnMasterData.names;
      const segs = bcnMasterData.segs;
      const localSegs = [];

      // Radio de corte amplio para cubrir toda Barcelona en Zona Alejada (hasta 12000m de visión)
      const maxDistM = 16000;
      const maxDistSq = maxDistM * maxDistM;
      const mPerDegLat = METERS_PER_DEG_LAT;
      const mPerDegLon = METERS_PER_DEG_LON;

      for (let i = 0; i < segs.length; i++) {
        const s = segs[i];
        const midLat = (s[0] + s[2]) * 0.5;
        const midLon = (s[1] + s[3]) * 0.5;
        const dy = (midLat - lat) * mPerDegLat;
        const dx = (midLon - lon) * mPerDegLon;
        const rawName = names[s[4]] || "";
        const name = formatStreetName(rawName);
        const isArterial = (s[5] === 4) || isMajorArterialName(name);

        if (Math.abs(dy) > maxDistM || Math.abs(dx) > maxDistM) continue;

        if (dx * dx + dy * dy <= maxDistSq) {
          const p1 = latLonToMeters(s[0], s[1]);
          const p2 = latLonToMeters(s[2], s[3]);
          const distKey = getBarcelonaDistrictKey(midLat, midLon);

          localSegs.push({
            x1: Math.round(p1.x),
            y1: Math.round(p1.y),
            x2: Math.round(p2.x),
            y2: Math.round(p2.y),
            name: name,
            isMajor: isArterial,
            districtKey: distKey,
            opacity: 1.0
          });
        }
      }

      if (localSegs.length > 10) {
        mapSegments = localSegs;
        lastSlicedLat = lat;
        lastSlicedLon = lon;
        if (bcnTopographyData) {
          sliceTopographyFromMaster(lat, lon);
        }
        if (bcnWaterData) {
          sliceWaterFromMaster(lat, lon);
        }
        vMapStatus.textContent = `${mapSegments.length} calles (Barcelona Vectorial)`;
        return true;
      }
      return false;
    }

    const OVERPASS_MIRRORS = [

    async function fetchRealStreetsForLocation(lat, lon) {
      if (isFetchingStreets) return;
      isFetchingStreets = true;
      if (mapSegments.length === 0) {
        vMapStatus.textContent = "descargando calles reales...";
      }

      const dLat = 0.0076;
      const dLon = 0.0076 / Math.cos(lat * Math.PI / 180);
      const s = (lat - dLat).toFixed(5);
      const w = (lon - dLon).toFixed(5);
      const n = (lat + dLat).toFixed(5);
      const e = (lon + dLon).toFixed(5);

      const query = `[out:json][timeout:8];(way(${s},${w},${n},${e})["highway"~"^(primary|secondary|tertiary|residential|trunk)$"];);out geom;`;

      let success = false;

      for (let idx = 0; idx < OVERPASS_MIRRORS.length; idx++) {
        const mirror = OVERPASS_MIRRORS[idx];
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 6500);

          let resp = null;
          try {
            resp = await fetch(`${mirror}?data=${encodeURIComponent(query)}`, {
              method: 'GET',
              signal: controller.signal
            });
          } catch(e) {
            resp = await fetch(mirror, {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: 'data=' + encodeURIComponent(query),
              signal: controller.signal
            });
          }
          clearTimeout(timeoutId);

          if (!resp || !resp.ok) continue;
          const data = await resp.json();
          if (!data || !data.elements || data.elements.length === 0) continue;

          const newSegs = [];
          for (let k = 0; k < data.elements.length; k++) {
            const elem = data.elements[k];
            if (elem.type === 'way' && elem.geometry && elem.geometry.length >= 2) {
              const highwayType = elem.tags ? elem.tags.highway : "";
              const rawName = elem.tags && elem.tags.name ? elem.tags.name : "";
              const name = formatStreetName(rawName);
              const isArterial = (highwayType === "primary" || highwayType === "trunk" || highwayType === "motorway") || isMajorArterialName(name);

              const pts = elem.geometry.map(p => latLonToMeters(p.lat, p.lon));
              for (let i = 0; i < pts.length - 1; i++) {
                const x1 = Math.round(pts[i].x);
                const y1 = Math.round(pts[i].y);
                const x2 = Math.round(pts[i + 1].x);
                const y2 = Math.round(pts[i + 1].y);
                const midLat = (elem.geometry[i].lat + elem.geometry[i + 1].lat) * 0.5;
                const midLon = (elem.geometry[i].lon + elem.geometry[i + 1].lon) * 0.5;
                const distKey = getBarcelonaDistrictKey(midLat, midLon);

                newSegs.push({
                  x1, y1, x2, y2,
                  name,
                  isMajor: isArterial,
                  districtKey: distKey,
                  opacity: 1.0
                });
              }
            }
            if (newSegs.length >= 1100) break;
          }

          if (newSegs.length > 5) {
            mapSegments = newSegs;
            saveMapCache(lat, lon, newSegs);
            vMapStatus.textContent = `${mapSegments.length} calles reales`;
            success = true;
            break;
          }
        } catch (err) {
          console.warn("Mirror falló:", mirror);
        }
      }

      if (!success && mapSegments.length === 0) {
        const loadedMaster = await loadBarcelonaMasterIfAvailable(lat, lon);
        if (!loadedMaster) {
          vMapStatus.textContent = "reintentando mapa...";
          setTimeout(() => { isFetchingStreets = false; fetchRealStreetsForLocation(lat, lon); }, 5000);
        } else {
          isFetchingStreets = false;
        }
      } else {
        isFetchingStreets = false;
      }
    }

    async function forceRefreshMap() {
      try {
        localStorage.removeItem('compas_map_v6_districts');
      } catch(e) {}
      if (window.compasState.userLat !== null) {
        const lat = window.compasState.userLat;
        const lon = window.compasState.userLon;
        if (isInsideBarcelonaArea(lat, lon)) {
          vMapStatus.textContent = "recargando barcelona...";
          bcnMasterData = null;
          bcnTopographyData = null;
          bcnWaterData = null;
          activeWaterLines = [];
          activeTopographyLines = [];
          await loadBarcelonaMasterIfAvailable(lat, lon);
        } else {
          vMapStatus.textContent = "recargando mapa amplio...";
          fetchRealStreetsForLocation(lat, lon);
        }
      }
    }

    // ==========================================
    // MOTOR DE RENDERIZADO CARTOGRÁFICO
    // Enfoque "Silencio Cartográfico": Calidez táctil, codificación vial por distritos y 60 FPS
    // ==========================================
    function renderOLED() {
      const theme = THEMES[currentThemeKey];

      // 1. Limpiar pantalla con el fondo cartográfico del tema actual
      ctx.fillStyle = theme.mapBg;
      ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);

      // Si aún no hay GPS ni mapa, mostrar radar cartográfico limpio
      if (!originInitialized || mapSegments.length === 0) {
        ctx.strokeStyle = getDistrictColor(null, currentThemeKey);
        ctx.lineWidth = 1;
        ctx.beginPath();
        const pulse = (Date.now() / 25) % 65;
        ctx.arc(CENTER_X, CENTER_Y, pulse, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = theme.uiText;
        ctx.font = '500 9px "IBM Plex Mono", monospace';
        ctx.textAlign = 'center';
        ctx.fillText("BUSCANDO GPS...", CENTER_X, CENTER_Y + 18);
        
        ctx.fillStyle = theme.userMarker;
        ctx.beginPath();
        ctx.arc(CENTER_X, CENTER_Y, 3, 0, Math.PI * 2);
        ctx.fill();

        requestAnimationFrame(renderOLED);
        return;
      }

      // Parámetros de orientación Heading-Up
      const radHeading = (window.compasState.heading * Math.PI) / 180.0;
      const cosH = Math.cos(radHeading);
      const sinH = Math.sin(radHeading);

      const uX = window.compasState.userX;
      const uY = window.compasState.userY;

      // Interpolación suave del Zoom Out con Slider Vertical continuo
      let targetMeters = VIEW_METERS_NORMAL;
      let targetDragRatio = 0.0;

      if (isPressing) {
        targetDragRatio = Math.min(1.0, currentDragY / 160.0);
        // Mapeo progresivo calibrado para recorrer cómodamente las 5 zonas de zoom:
        // - Zona Cercana (240m - 600m) en el primer 25% del recorrido (0 a 0.25)
        // - Zona Media (600m - 1500m) entre el 25% y 50% del recorrido (0.25 a 0.50)
        // - Zona de Barrios (1500m - 2500m) entre el 50% y 72% del recorrido (0.50 a 0.72)
        // - Zona Distante (2500m - 12000m) entre el 72% y 88% del recorrido (0.72 a 0.88)
        // - Zona Geográfica (12000m - 15000m) en el tramo final (0.88 a 1.0)
        if (targetDragRatio <= 0.25) {
          targetMeters = VIEW_METERS_PEEK + (targetDragRatio / 0.25) * (600.0 - VIEW_METERS_PEEK);
        } else if (targetDragRatio <= 0.50) {
          targetMeters = 600.0 + ((targetDragRatio - 0.25) / 0.25) * (1500.0 - 600.0);
        } else if (targetDragRatio <= 0.72) {
          targetMeters = 1500.0 + ((targetDragRatio - 0.50) / 0.22) * (2500.0 - 1500.0);
        } else if (targetDragRatio <= 0.88) {
          targetMeters = 2500.0 + ((targetDragRatio - 0.72) / 0.16) * (12000.0 - 2500.0);
        } else {
          targetMeters = 12000.0 + ((targetDragRatio - 0.88) / 0.12) * (VIEW_METERS_MAX - 12000.0);
        }
      }

      smoothViewMeters += (targetMeters - smoothViewMeters) * 0.16;
      smoothDragRatio += (targetDragRatio - smoothDragRatio) * 0.16;
      if (Math.abs(targetMeters - smoothViewMeters) < 0.2) smoothViewMeters = targetMeters;

      const currentViewMeters = smoothViewMeters;
      const currentPixelsPerMeter = SCREEN_W / currentViewMeters;
      const cullingRadius = (currentViewMeters / 2.0) * 1.45;

      // 1.5. CAPA 0: LÍNEAS TOPOGRÁFICAS (Curvas de nivel en fondo, adaptadas dinámicamente según nivel de zoom)
      if (activeTopographyLines.length > 0) {
        ctx.save();
        ctx.strokeStyle = theme.topoLine;
        ctx.lineWidth = (smoothViewMeters > 2500) ? 1.0 : (smoothViewMeters > 600 ? 0.85 : 0.75);
        ctx.beginPath();

        // Nivel de detalle (LOD) dinámico para curvas de nivel armonizado con las 4 zonas:
        // - Zona Cercana (<= 600m): Todas las curvas (intervalo 5m denso, paso 1)
        // - Zona Media (600m - 1500m): Curvas maestras 20m + intermedias alternadas (paso 1)
        // - Zona de Barrios (1500m - 2500m): Curvas maestras de 20m (paso 2)
        // - Zona Distante (2500m - 12000m): Curvas maestras de 20m (paso 2 / paso 3 > 6000m)
        const isFarZoom = smoothViewMeters > 6000;
        const isMidZoom = smoothViewMeters > 1500;
        const isTransition = smoothViewMeters > 600;
        const pointStep = isFarZoom ? 3 : (isMidZoom ? 2 : 1);

        for (let t = 0; t < activeTopographyLines.length; t++) {
          const line = activeTopographyLines[t];

          // Filtrar según zoom LOD
          if (isFarZoom) {
            if (!line.isMajor || line.count < 6) continue;
          } else if (isMidZoom) {
            if (!line.isMajor) continue;
          } else if (isTransition) {
            if (!line.isMajor && (line.id % 2 !== 0)) continue;
          }

          // Descarte rápido fuera del campo de visión (Culling O(1) con bounding box)
          const dxMin = line.minX - uX;
          const dxMax = line.maxX - uX;
          const dyMin = line.minY - uY;
          const dyMax = line.maxY - uY;

          if (dxMax < -cullingRadius || dxMin > cullingRadius ||
              dyMax < -cullingRadius || dyMin > cullingRadius) {
            continue;
          }

          const pts = line.pts;
          const count = line.count;

          for (let p = 0; p < count; p += pointStep) {
            const mx = pts[p * 2];
            const my = pts[p * 2 + 1];
            const dx = mx - uX;
            const dy = my - uY;

            const rx = dx * cosH - dy * sinH;
            const ry = dx * sinH + dy * cosH;

            const sx = Math.round(CENTER_X + rx * currentPixelsPerMeter);
            const sy = Math.round(CENTER_Y - ry * currentPixelsPerMeter);

            if (p === 0) {
              ctx.moveTo(sx, sy);
            } else {
              ctx.lineTo(sx, sy);
            }
          }

          // Asegurar conexión del punto final si el paso no cayó en el último índice
          if ((count - 1) % pointStep !== 0) {
            const lastIdx = (count - 1) * 2;
            const mx = pts[lastIdx];
            const my = pts[lastIdx + 1];
            const dx = mx - uX;
            const dy = my - uY;
            const rx = dx * cosH - dy * sinH;
            const ry = dx * sinH + dy * cosH;
            const sx = Math.round(CENTER_X + rx * currentPixelsPerMeter);
            const sy = Math.round(CENTER_Y - ry * currentPixelsPerMeter);
            ctx.lineTo(sx, sy);
          }
        }
        ctx.stroke();
        ctx.restore();
      }

      // ==========================================
      // 1.8. CAPA DE AGUA Y RÍOS EN CELESTE (Riu Besòs, Riu Llobregat, Canales y Costa)
      // Visibles en vista panorámica y destacados prominentemente en la Zona Geográfica (12000m - 15000m)
      // ==========================================
      if (activeWaterLines.length > 0) {
        // Suave aparición desde 4.000m, plena visibilidad (1.0) desde 9.500m hasta 15.000m
        const waterAlpha = smoothstep(4000, 9500, smoothViewMeters);
        if (waterAlpha > 0.02) {
          ctx.save();
          ctx.globalAlpha = waterAlpha;

          const isGeoZone = smoothViewMeters >= 11800;
          const riverWidth = isGeoZone ? 2.2 : 1.7;
          const coastWidth = isGeoZone ? 1.3 : 1.0;

          // A) Línea de costa y dársenas del puerto en celeste sutil
          ctx.strokeStyle = theme.waterCoast;
          ctx.lineWidth = coastWidth;
          ctx.beginPath();
          for (let w = 0; w < activeWaterLines.length; w++) {
            const line = activeWaterLines[w];
            if (line.isRiver) continue;

            const dxMin = line.minX - uX;
            const dxMax = line.maxX - uX;
            const dyMin = line.minY - uY;
            const dyMax = line.maxY - uY;
            if (dxMax < -cullingRadius || dxMin > cullingRadius || dyMax < -cullingRadius || dyMin > cullingRadius) continue;

            const pts = line.pts;
            const count = line.count;
            for (let p = 0; p < count; p++) {
              const mx = pts[p * 2];
              const my = pts[p * 2 + 1];
              const dx = mx - uX;
              const dy = my - uY;
              const rx = dx * cosH - dy * sinH;
              const ry = dx * sinH + dy * cosH;
              const sx = Math.round(CENTER_X + rx * currentPixelsPerMeter);
              const sy = Math.round(CENTER_Y - ry * currentPixelsPerMeter);
              if (p === 0) ctx.moveTo(sx, sy);
              else ctx.lineTo(sx, sy);
            }
          }
          ctx.stroke();

          // B) Ríos principales (Riu Besòs y Riu Llobregat) en CELESTE destacado
          ctx.strokeStyle = theme.waterRiver;
          ctx.lineWidth = riverWidth;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.beginPath();
          for (let w = 0; w < activeWaterLines.length; w++) {
            const line = activeWaterLines[w];
            if (!line.isRiver) continue;

            const dxMin = line.minX - uX;
            const dxMax = line.maxX - uX;
            const dyMin = line.minY - uY;
            const dyMax = line.maxY - uY;
            if (dxMax < -cullingRadius || dxMin > cullingRadius || dyMax < -cullingRadius || dyMin > cullingRadius) continue;

            const pts = line.pts;
            const count = line.count;
            for (let p = 0; p < count; p++) {
              const mx = pts[p * 2];
              const my = pts[p * 2 + 1];
              const dx = mx - uX;
              const dy = my - uY;
              const rx = dx * cosH - dy * sinH;
              const ry = dx * sinH + dy * cosH;
              const sx = Math.round(CENTER_X + rx * currentPixelsPerMeter);
              const sy = Math.round(CENTER_Y - ry * currentPixelsPerMeter);
              if (p === 0) ctx.moveTo(sx, sy);
              else ctx.lineTo(sx, sy);
            }
          }
          ctx.stroke();

          ctx.restore();
        }
      }

      // 2. CAPA 1: RED VIAL (Color por distrito, grosor por jerarquía, opacidad preparada)
      const districtBatches = {};
      const majorCandidatesMap = new Map();
      const minorCandidatesMap = new Map();

      for (let i = 0; i < mapSegments.length; i++) {
        const seg = mapSegments[i];

        const dx1 = seg.x1 - uX;
        const dy1 = seg.y1 - uY;
        const dx2 = seg.x2 - uX;
        const dy2 = seg.y2 - uY;

        // Descarte rápido fuera del campo de visión dinámico (Culling)
        if ((dx1 < -cullingRadius && dx2 < -cullingRadius) ||
            (dx1 >  cullingRadius && dx2 >  cullingRadius) ||
            (dy1 < -cullingRadius && dy2 < -cullingRadius) ||
            (dy1 >  cullingRadius && dy2 >  cullingRadius)) {
          continue;
        }

        // Rotación 2D Heading-Up:
        const rx1 = dx1 * cosH - dy1 * sinH;
        const ry1 = dx1 * sinH + dy1 * cosH;
        const rx2 = dx2 * cosH - dy2 * sinH;
        const ry2 = dx2 * sinH + dy2 * cosH;

        // Proyección a pantalla 256x256 con escala adaptativa
        const sx1 = Math.round(CENTER_X + rx1 * currentPixelsPerMeter);
        const sy1 = Math.round(CENTER_Y - ry1 * currentPixelsPerMeter);
        const sx2 = Math.round(CENTER_X + rx2 * currentPixelsPerMeter);
        const sy2 = Math.round(CENTER_Y - ry2 * currentPixelsPerMeter);

        // Descartar segmentos que colapsan a longitud 0 en este nivel de zoom
        if (sx1 === sx2 && sy1 === sy2) continue;

        const isMajor = !!seg.isMajor;
        const distKey = seg.districtKey || 'fallback';
        const op = (typeof seg.opacity === 'number') ? seg.opacity : 1.0;

        if (!districtBatches[distKey]) {
          districtBatches[distKey] = {
            sec: [],
            pri: [],
            color: getDistrictColor(distKey, currentThemeKey),
            opacity: op
          };
        }

        const batch = districtBatches[distKey];
        if (isMajor) {
          batch.pri.push(sx1, sy1, sx2, sy2);
        } else {
          batch.sec.push(sx1, sy1, sx2, sy2);
        }

        // Candidatos con nombre para etiquetas orientadas a lo largo de los vectores:
        // Se calcula el vector en pantalla, ángulo orientado (never upside-down) y se elige el tramo central óptimo
        if (seg.name && seg.name.length > 1) {
          const mx = (sx1 + sx2) / 2;
          const my = (sy1 + sy2) / 2;
          if (mx >= 20 && mx <= SCREEN_W - 20 && my >= 26 && my <= SCREEN_H - 16) {
            const segLen = Math.hypot(sx2 - sx1, sy2 - sy1);
            if (segLen >= 10) {
              const key = seg.name.trim().toLowerCase();
              const distCenter = Math.hypot(mx - CENTER_X, my - CENTER_Y);

              // Ángulo orientado a lo largo de la calle
              let angle = Math.atan2(sy2 - sy1, sx2 - sx1);
              // Regla "Never upside-down": siempre legible de izquierda a derecha
              if (angle > Math.PI / 2) {
                angle -= Math.PI;
              } else if (angle < -Math.PI / 2) {
                angle += Math.PI;
              }

              // Puntuación del mejor tramo:
              // - Prefiere tramos más largos (cuerpo de manzana, lejos de esquinas)
              // - Prefiere la zona intermedia de lectura (radio ~65px), evitando saturar el centro exacto (R < 35px)
              const score = segLen * 1.5 - Math.abs(distCenter - 65);

              const candidate = {
                name: seg.name,
                formattedName: formatStreetName(seg.name).toLowerCase(),
                mx, my,
                angle,
                segLen,
                isMajor,
                districtKey: distKey,
                distCenter,
                score
              };

              if (isMajor) {
                const existing = majorCandidatesMap.get(key);
                if (!existing || candidate.score > existing.score) {
                  majorCandidatesMap.set(key, candidate);
                }
              } else {
                const existing = minorCandidatesMap.get(key);
                if (!existing || candidate.score > existing.score) {
                  minorCandidatesMap.set(key, candidate);
                }
              }
            }
          }
        }
      }

      // =========================================================================
      // ARQUITECTURA DE 5 CAPAS SEMÁNTICAS POR NIVEL DE ZOOM:
      // 1. ZONA CERCANA    (240m - 600m): Todas las calles (100%) + etiquetas de calles en minúsculas (sin prioridad).
      // 2. ZONA MEDIA      (600m - 1500m): Todas las calles (100%) + etiquetas de calles en minúsculas (priorizando vías principales).
      // 3. ZONA DE BARRIOS (1500m - 2500m): Todas las calles (100%) + SÓLO etiquetas de barrios (primera letra mayúscula). Ninguna calle rotulada.
      // 4. ZONA DISTANTE   (2500m - 12000m): Todas las calles (100%) + SÓLO etiquetas de distritos en mayúsculas.
      // 5. ZONA GEOGRÁFICA (12000m - 15000m): Vista exclusiva de relieve y geografía.
      //    Calles 0% (ocultas) y distritos 0% (ocultos). SÓLO curvas de nivel, ríos en celeste + etiquetas halo para ríos, montañas y mar.
      // =========================================================================

      // A) VISIBILIDAD DE CALLES SECUNDARIAS / PEQUEÑAS Y B) VÍAS PRINCIPALES:
      // Transición ultra-suave (smoothstep) al desvanecer los colores y calles hacia la Zona Geográfica:
      // - Desaturación gradual de colores de distritos hacia neutro entre 9.000m y 11.500m
      // - Desvanecimiento continuo de opacidad entre 9.500m y 12.000m sin saltos abruptos
      const colorDesat = smoothstep(9000, 11500, smoothViewMeters);
      const streetFade = 1.0 - smoothstep(9500, 12000, smoothViewMeters);

      if (streetFade > 0.005) {
        // Grosor con jerarquía: 1.1px en zonas cercana y media; trazo fino suave en barrios y distante (> 1500m).
        const secLineWidth = (smoothViewMeters <= 1500)
          ? 1.1
          : Math.max(0.65, 1.1 - ((smoothViewMeters - 1500) / 10500) * 0.45);

        ctx.lineWidth = secLineWidth;
        for (const key in districtBatches) {
          const batch = districtBatches[key];
          if (batch.sec.length === 0) continue;
          ctx.save();
          ctx.strokeStyle = (colorDesat > 0.01)
            ? lerpColor(batch.color, theme.streetNeutral, colorDesat)
            : batch.color;
          const effAlpha = ((typeof batch.opacity === 'number') ? batch.opacity : 1.0) * streetFade;
          if (effAlpha < 0.99) ctx.globalAlpha = Math.max(0.0, Math.min(1.0, effAlpha));
          ctx.beginPath();
          for (let j = 0; j < batch.sec.length; j += 4) {
            ctx.moveTo(batch.sec[j], batch.sec[j + 1]);
            ctx.lineTo(batch.sec[j + 2], batch.sec[j + 3]);
          }
          ctx.stroke();
          ctx.restore();
        }

        // B) VISIBILIDAD DE VÍAS PRINCIPALES:
        // Visibles al 100% en zonas 1 a 4.
        // Grosor destacado y grueso: 2.4px en zonas cercana y media; 2.0px–1.6px en barrios y distante (> 1500m).
        const priLineWidth = (smoothViewMeters <= 1500)
          ? 2.4
          : Math.max(1.6, 2.4 - ((smoothViewMeters - 1500) / 10500) * 0.8);

        ctx.lineWidth = priLineWidth;
        for (const key in districtBatches) {
          const batch = districtBatches[key];
          if (batch.pri.length === 0) continue;
          ctx.save();
          ctx.strokeStyle = (colorDesat > 0.01)
            ? lerpColor(batch.color, theme.streetNeutral, colorDesat)
            : batch.color;
          const effAlpha = ((typeof batch.opacity === 'number') ? batch.opacity : 1.0) * streetFade;
          if (effAlpha < 0.99) ctx.globalAlpha = Math.max(0.0, Math.min(1.0, effAlpha));
          ctx.beginPath();
          for (let j = 0; j < batch.pri.length; j += 4) {
            ctx.moveTo(batch.pri[j], batch.pri[j + 1]);
            ctx.lineTo(batch.pri[j + 2], batch.pri[j + 3]);
          }
          ctx.stroke();
          ctx.restore();
        }
      }

      // ==========================================
      // C) ETIQUETAS DE CALLES ORIENTADAS AL VECTOR CON HALO (ej: "c. marina"):
      // - Impresas justo arriba de los vectores de las calles, alineadas con su trayectoria.
      // - Eliminan la auto-orientación horizontal en favor de una clara asociación calle-etiqueta.
      // - Impresas en el centro del tramo de la manzana (lejos de intersecciones).
      // - Sin caja/insignia: texto tipográfico puro con halo protector del color de fondo del mapa.
      // - Priorización según zona de zoom:
      //   * Zona Cercana (240m - 600m): Sin prioridad de vías principales sobre secundarias.
      //     Todas las vías compiten por cercanía al usuario (centro de pantalla) para dar visibilidad local.
      //   * Zona Media (600m - 1500m): SÍ se priorizan vías principales sobre secundarias.
      //     Las principales van primero, y las secundarias completan el cupo hasta 6 etiquetas.
      // - Cupo máximo: hasta 6 etiquetas simultáneas.
      // - Zona de Barrios y Distante (> 1500m): Se ocultan todas las etiquetas de calles.
      // ==========================================
      const streetLabelOpacity = Math.max(0, Math.min(1.0, 1.0 - (smoothViewMeters - 1450) / 100));

      if (streetLabelOpacity > 0.02) {
        ctx.save();
        ctx.globalAlpha = streetLabelOpacity;
        ctx.font = "600 8.5px 'IBM Plex Mono', monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Selección rigurosa de las hasta 6 etiquetas según zona:
        const candidateList = [];
        const isNearZone = smoothViewMeters <= 600;

        if (isNearZone) {
          // En Zona Cercana (240m - 600m): NO se priorizan principales sobre secundarias.
          // Se combinan todas las calles únicas y se ordenan por proximidad al usuario (centro de la pantalla).
          const allUnique = [...majorCandidatesMap.values()];
          for (const item of minorCandidatesMap.values()) {
            if (!majorCandidatesMap.has(item.name.trim().toLowerCase())) {
              allUnique.push(item);
            }
          }
          allUnique.sort((a, b) => a.distCenter - b.distCenter);
          for (let m = 0; m < Math.min(6, allUnique.length); m++) {
            candidateList.push(allUnique[m]);
          }
        } else {
          // En Zona Media (600m - 1500m): SÍ se priorizan vías principales sobre secundarias.
          // Las vías principales van primero (ordenadas por cercanía al centro),
          // y luego las secundarias completan el cupo hasta 6 etiquetas.
          const majors = [...majorCandidatesMap.values()].sort((a, b) => a.distCenter - b.distCenter);
          const minors = [];
          for (const item of minorCandidatesMap.values()) {
            if (!majorCandidatesMap.has(item.name.trim().toLowerCase())) {
              minors.push(item);
            }
          }
          minors.sort((a, b) => a.distCenter - b.distCenter);

          for (let m = 0; m < majors.length && candidateList.length < 6; m++) {
            candidateList.push(majors[m]);
          }
          for (let m = 0; m < minors.length && candidateList.length < 6; m++) {
            candidateList.push(minors[m]);
          }
        }

        // Renderizado orientado a lo largo del vector vial con halo protector
        for (let k = 0; k < candidateList.length; k++) {
          const item = candidateList[k];

          ctx.save();
          // Trasladar al centro exacto del tramo y rotar tangencialmente a la calle
          ctx.translate(item.mx, item.my);
          ctx.rotate(item.angle);

          // 1. Halo protector en color de fondo del mapa para máximo contraste y legibilidad
          ctx.strokeStyle = theme.mapBg;
          ctx.lineWidth = 3.2;
          ctx.lineJoin = "round";
          ctx.miterLimit = 2;
          ctx.strokeText(item.formattedName, 0, -6.0);

          // 2. Texto tipográfico limpio en minúsculas flotando justo arriba de la calzada
          ctx.fillStyle = theme.labelText;
          ctx.fillText(item.formattedName, 0, -6.0);

          ctx.restore();
        }

        ctx.restore();
      }

      // ==========================================
      // D) ETIQUETAS DE BARRIOS EN ZONA DE BARRIOS (1500m - 2500m)
      // Aparecen exclusivamente en Zona de Barrios, con primera letra mayúscula (ej: "El Baix Guinardó")
      // Ocultas en Zona Cercana, Zona Media y Zona Distante. Ninguna calle rotulada aquí.
      // ==========================================
      const barrioFadeIn = Math.min(1.0, Math.max(0, (smoothViewMeters - 1450) / 100));
      const barrioFadeOut = Math.max(0, Math.min(1.0, 1.0 - (smoothViewMeters - 2450) / 100));
      const barrioOpacity = Math.min(barrioFadeIn, barrioFadeOut);

      if (barrioOpacity > 0.02) {
        ctx.save();
        ctx.globalAlpha = barrioOpacity;
        ctx.font = "500 8px 'IBM Plex Mono', monospace";
        ctx.textBaseline = "middle";

        // Ordenar barrios por cercanía al usuario (centro de pantalla)
        const sortedBarris = BARCELONA_BARRIS.map(b => {
          const m = latLonToMeters(b.lat, b.lon);
          const dx = m.x - uX;
          const dy = m.y - uY;
          return { ...b, dx, dy, d2: dx * dx + dy * dy };
        }).sort((a, b) => a.d2 - b.d2);

        const visibleBarrios = [];
        for (let d = 0; d < sortedBarris.length; d++) {
          if (visibleBarrios.length >= 8) break;
          const barriObj = sortedBarris[d];

          const rx = barriObj.dx * cosH - barriObj.dy * sinH;
          const ry = barriObj.dx * sinH + barriObj.dy * cosH;

          const sx = Math.round(CENTER_X + rx * currentPixelsPerMeter);
          const sy = Math.round(CENTER_Y - ry * currentPixelsPerMeter);

          if (sx >= 10 && sx <= SCREEN_W - 10 && sy >= 26 && sy <= SCREEN_H - 14) {
            visibleBarrios.push({ ...barriObj, sx, sy });
          }
        }

        const barrioBoxes = [];
        for (let d = 0; d < visibleBarrios.length; d++) {
          const barriObj = visibleBarrios[d];
          const formattedName = formatBarriName(barriObj.barri);
          const lines = splitBarriNameToLines(formattedName);
          const distKey = normalizeDistrictName(barriObj.dist);
          const badgeBorderColor = getDistrictColor(distKey, currentThemeKey);

          let badgeW = 0;
          let badgeH = 0;
          if (lines.length === 1) {
            const tw = ctx.measureText(lines[0]).width;
            badgeW = Math.round(tw + 8);
            badgeH = 14;
          } else {
            const tw1 = ctx.measureText(lines[0]).width;
            const tw2 = ctx.measureText(lines[1]).width;
            badgeW = Math.round(Math.max(tw1, tw2) + 8);
            badgeH = 22;
          }

          barrioBoxes.push({
            name: formattedName,
            lines,
            badgeBorderColor,
            w: badgeW,
            h: badgeH,
            origX: barriObj.sx,
            origY: barriObj.sy,
            cx: barriObj.sx,
            cy: barriObj.sy
          });
        }

        const barrioBounds = { minX: 4, maxX: SCREEN_W - 4, minY: 24, maxY: SCREEN_H - 12 };
        relaxLabelBoxes(barrioBoxes, barrioBounds, 18);

        for (let d = 0; d < barrioBoxes.length; d++) {
          const box = barrioBoxes[d];
          const targetShiftX = box.cx - box.origX;
          const targetShiftY = box.cy - box.origY;

          let shift = barrioLabelShiftMap.get(box.name);
          if (!shift) {
            shift = { dx: targetShiftX, dy: targetShiftY, lastSeen: labelAnimFrameCount };
            barrioLabelShiftMap.set(box.name, shift);
          } else {
            const easing = 0.22;
            shift.dx += (targetShiftX - shift.dx) * easing;
            shift.dy += (targetShiftY - shift.dy) * easing;
            shift.lastSeen = labelAnimFrameCount;
          }

          const renderCx = box.origX + shift.dx;
          const renderCy = box.origY + shift.dy;
          const bx = Math.round(renderCx - box.w / 2);
          const by = Math.round(renderCy - box.h / 2);

          drawBadge(ctx, bx, by, box.w, box.h, 2, theme.labelBg, box.badgeBorderColor);

          ctx.fillStyle = theme.labelText;
          ctx.textAlign = "center";
          if (box.lines.length === 1) {
            ctx.fillText(box.lines[0], renderCx, renderCy + 0.5);
          } else {
            ctx.fillText(box.lines[0], renderCx, renderCy - 4.5);
            ctx.fillText(box.lines[1], renderCx, renderCy + 4.5);
          }
        }

        ctx.restore();

        if (labelAnimFrameCount % 120 === 0) {
          for (const [key, shift] of barrioLabelShiftMap.entries()) {
            if (labelAnimFrameCount - shift.lastSeen > 90) {
              barrioLabelShiftMap.delete(key);
            }
          }
        }
      }

      // ==========================================
      // E) ETIQUETAS DE DISTRITOS EN ZONA DISTANTE (2500m - 12000m)
      // Aparecen exclusivamente al entrar en Zona Distante (> 2500m), en mayúsculas (ej: "EIXAMPLE")
      // Ocultas en Zona Cercana, Zona Media, Zona de Barrios y Zona Geográfica (> 12000m)
      // ==========================================
      const distFadeIn = Math.min(1.0, Math.max(0, (smoothViewMeters - 2450) / 100));
      const distFadeOut = 1.0 - smoothstep(9500, 11800, smoothViewMeters);
      const districtOpacity = Math.min(distFadeIn, distFadeOut);
      if (districtOpacity > 0.02) {
        ctx.save();
        ctx.globalAlpha = districtOpacity;
        ctx.font = "600 8px 'IBM Plex Mono', monospace";
        ctx.textBaseline = "middle";

        // Ordenar distritos por cercanía al usuario para priorizar la etiqueta local
        const sortedDistricts = BARCELONA_DISTRICT_CENTROIDS.map(d => {
          const m = latLonToMeters(d.lat, d.lon);
          const dx = m.x - uX;
          const dy = m.y - uY;
          return { ...d, dx, dy, d2: dx * dx + dy * dy };
        }).sort((a, b) => a.d2 - b.d2);

        const visibleDistricts = [];
        for (let d = 0; d < sortedDistricts.length; d++) {
          const distObj = sortedDistricts[d];

          const rx = distObj.dx * cosH - distObj.dy * sinH;
          const ry = distObj.dx * sinH + distObj.dy * cosH;

          const sx = Math.round(CENTER_X + rx * currentPixelsPerMeter);
          const sy = Math.round(CENTER_Y - ry * currentPixelsPerMeter);

          if (sx >= 10 && sx <= SCREEN_W - 10 && sy >= 24 && sy <= SCREEN_H - 12) {
            visibleDistricts.push({ ...distObj, sx, sy });
          }
        }

        const districtBoxes = [];
        for (let d = 0; d < visibleDistricts.length; d++) {
          const distObj = visibleDistricts[d];
          const lines = splitDistrictNameToLines(distObj.name.toUpperCase());
          const badgeBorderColor = getDistrictColor(distObj.key, currentThemeKey);

          let badgeW = 0;
          let badgeH = 0;
          if (lines.length === 1) {
            const tw = ctx.measureText(lines[0]).width;
            badgeW = Math.round(tw + 8);
            badgeH = 13;
          } else {
            const tw1 = ctx.measureText(lines[0]).width;
            const tw2 = ctx.measureText(lines[1]).width;
            badgeW = Math.round(Math.max(tw1, tw2) + 8);
            badgeH = 20;
          }

          districtBoxes.push({
            name: distObj.name.toUpperCase(),
            lines,
            badgeBorderColor,
            w: badgeW,
            h: badgeH,
            origX: distObj.sx,
            origY: distObj.sy,
            cx: distObj.sx,
            cy: distObj.sy
          });
        }

        const distBounds = { minX: 4, maxX: SCREEN_W - 4, minY: 24, maxY: SCREEN_H - 12 };
        relaxLabelBoxes(districtBoxes, distBounds, 18);

        for (let d = 0; d < districtBoxes.length; d++) {
          const box = districtBoxes[d];
          const targetShiftX = box.cx - box.origX;
          const targetShiftY = box.cy - box.origY;

          let shift = districtLabelShiftMap.get(box.name);
          if (!shift) {
            shift = { dx: targetShiftX, dy: targetShiftY, lastSeen: labelAnimFrameCount };
            districtLabelShiftMap.set(box.name, shift);
          } else {
            const easing = 0.22;
            shift.dx += (targetShiftX - shift.dx) * easing;
            shift.dy += (targetShiftY - shift.dy) * easing;
            shift.lastSeen = labelAnimFrameCount;
          }

          const renderCx = box.origX + shift.dx;
          const renderCy = box.origY + shift.dy;
          const bx = Math.round(renderCx - box.w / 2);
          const by = Math.round(renderCy - box.h / 2);

          drawBadge(ctx, bx, by, box.w, box.h, 2, theme.labelBg, box.badgeBorderColor);

          ctx.fillStyle = theme.labelText;
          ctx.textAlign = "center";
          if (box.lines.length === 1) {
            ctx.fillText(box.lines[0], renderCx, renderCy + 0.5);
          } else {
            ctx.fillText(box.lines[0], renderCx, renderCy - 4.5);
            ctx.fillText(box.lines[1], renderCx, renderCy + 4.5);
          }
        }

        ctx.restore();

        if (labelAnimFrameCount % 120 === 0) {
          for (const [key, shift] of districtLabelShiftMap.entries()) {
            if (labelAnimFrameCount - shift.lastSeen > 90) {
              districtLabelShiftMap.delete(key);
            }
          }
        }
      }

      // ==========================================
      // F) ETIQUETAS GEOGRÁFICAS EN ZONA GEOGRÁFICA (12000m - 15000m)
      // En esta capa desaparecen todas las calles y etiquetas de distritos.
      // Vista exclusiva para la geografía: relieve, ríos en celeste y etiquetas de ríos, montañas y mar.
      // Estilo de etiqueta idéntico al de las calles: tipo halo sin caja/insignia, en minúsculas.
      // ==========================================
      const geoOpacity = smoothstep(11200, 12200, smoothViewMeters);
      if (geoOpacity > 0.02) {
        ctx.save();
        ctx.globalAlpha = geoOpacity;
        ctx.font = "600 8.5px 'IBM Plex Mono', monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const visibleGeos = [];
        for (let g = 0; g < BARCELONA_GEOGRAPHIC_FEATURES.length; g++) {
          const feat = BARCELONA_GEOGRAPHIC_FEATURES[g];
          const m = latLonToMeters(feat.lat, feat.lon);
          const dx = m.x - uX;
          const dy = m.y - uY;

          const rx = dx * cosH - dy * sinH;
          const ry = dx * sinH + dy * cosH;

          const sx = Math.round(CENTER_X + rx * currentPixelsPerMeter);
          const sy = Math.round(CENTER_Y - ry * currentPixelsPerMeter);

          if (sx >= 12 && sx <= SCREEN_W - 12 && sy >= 28 && sy <= SCREEN_H - 14) {
            visibleGeos.push({ ...feat, sx, sy });
          }
        }

        const geoBoxes = [];
        for (let g = 0; g < visibleGeos.length; g++) {
          const feat = visibleGeos[g];
          const tw = ctx.measureText(feat.label).width;
          geoBoxes.push({
            name: feat.key,
            label: feat.label,
            w: Math.round(tw + 8),
            h: 12,
            origX: feat.sx,
            origY: feat.sy,
            cx: feat.sx,
            cy: feat.sy
          });
        }

        const geoBounds = { minX: 10, maxX: SCREEN_W - 10, minY: 28, maxY: SCREEN_H - 12 };
        relaxLabelBoxes(geoBoxes, geoBounds, 18);

        for (let g = 0; g < geoBoxes.length; g++) {
          const box = geoBoxes[g];
          const targetShiftX = box.cx - box.origX;
          const targetShiftY = box.cy - box.origY;

          let shift = geoLabelShiftMap.get(box.name);
          if (!shift) {
            shift = { dx: targetShiftX, dy: targetShiftY, lastSeen: labelAnimFrameCount };
            geoLabelShiftMap.set(box.name, shift);
          } else {
            const easing = 0.22;
            shift.dx += (targetShiftX - shift.dx) * easing;
            shift.dy += (targetShiftY - shift.dy) * easing;
            shift.lastSeen = labelAnimFrameCount;
          }

          const renderCx = box.origX + shift.dx;
          const renderCy = box.origY + shift.dy;

          // 1. Halo protector en color de fondo del mapa (knockout halo sin caja)
          ctx.strokeStyle = theme.mapBg;
          ctx.lineWidth = 3.5;
          ctx.lineJoin = "round";
          ctx.miterLimit = 2;
          ctx.strokeText(box.label, renderCx, renderCy);

          // 2. Texto tipográfico limpio en minúsculas
          ctx.fillStyle = theme.labelText;
          ctx.fillText(box.label, renderCx, renderCy);
        }

        ctx.restore();

        if (labelAnimFrameCount % 120 === 0) {
          for (const [key, shift] of geoLabelShiftMap.entries()) {
            if (labelAnimFrameCount - shift.lastSeen > 90) {
              geoLabelShiftMap.delete(key);
            }
          }
        }
      }

      // 4. HUD SUPERIOR: ENCABEZADO "DISTRITO | BARRIO" + PUNTO 7PX DEL DISTRITO + BOTÓN SOL/LUNA
      ctx.fillStyle = theme.headerBg;
      ctx.fillRect(0, 0, SCREEN_W, 22);
      ctx.strokeStyle = theme.headerBorder;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, 22.5);
      ctx.lineTo(SCREEN_W, 22.5);
      ctx.stroke();

      // Botón minimalista de alternancia de modo con ícono de sol / luna (trazo fino 1.5px, sin relleno)
      ctx.save();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = theme.uiText;
      if (currentThemeKey === "light") {
        ctx.beginPath();
        ctx.arc(12, 11, 4.2, -0.6 * Math.PI, 0.8 * Math.PI, false);
        ctx.quadraticCurveTo(11.2, 11, 12 + 4.2 * Math.cos(-0.6 * Math.PI), 11 + 4.2 * Math.sin(-0.6 * Math.PI));
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(12, 11, 2.5, 0, Math.PI * 2);
        for (let a = 0; a < 8; a++) {
          const ang = (a * Math.PI) / 4;
          const ca = Math.cos(ang), sa = Math.sin(ang);
          ctx.moveTo(12 + ca * 4.2, 11 + sa * 4.2);
          ctx.lineTo(12 + ca * 5.8, 11 + sa * 5.8);
        }
        ctx.stroke();
      }
      ctx.restore();

      // Encabezado con punto de 7px del color del distrito + texto en mayúsculas
      ctx.save();
      const zoneStr = (window.compasState.districtNeighborhood || "UBICACIÓN REAL").toUpperCase();
      const currentDistKey = window.compasState.currentDistrictKey || null;
      const currentDistColor = getDistrictColor(currentDistKey, currentThemeKey);

      if ("letterSpacing" in ctx) ctx.letterSpacing = "0.08em";
      if (zoneStr.length > 25) {
        ctx.font = "600 8.5px 'IBM Plex Mono', monospace";
      } else {
        ctx.font = "600 9.5px 'IBM Plex Mono', monospace";
      }

      const tw = ctx.measureText(zoneStr).width;
      const dotDiameter = 7;
      const dotRadius = 3.5;
      const gap = 6;
      const totalHeaderWidth = dotDiameter + gap + tw;

      let headerStartX = Math.round(CENTER_X - totalHeaderWidth / 2);
      if (headerStartX < 28) headerStartX = 28;

      const dotCenterX = headerStartX + dotRadius;
      const textStartX = headerStartX + dotDiameter + gap;

      // Punto circular de 7px con el color del distrito actual (dinámico al cambiar de zona o modo)
      ctx.fillStyle = currentDistColor;
      ctx.beginPath();
      ctx.arc(dotCenterX, 11.5, dotRadius, 0, Math.PI * 2);
      ctx.fill();

      // Nombre del distrito / barrio
      ctx.fillStyle = theme.uiText;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(zoneStr, textStartX, 11.5);
      ctx.restore();

      // 5. MARCADOR DE POSICIÓN DEL USUARIO (Centro 128, 128)
      // Único acento cromático del mapa base: bermellón (#D1493B / #E85D4A) con halo de protección
      ctx.save();
      ctx.fillStyle = theme.mapBg;
      ctx.beginPath();
      ctx.arc(CENTER_X, CENTER_Y, 7.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = theme.userMarker;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(CENTER_X, CENTER_Y, 6, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = theme.userMarker;
      ctx.beginPath();
      ctx.arc(CENTER_X, CENTER_Y, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 6. INDICADOR DEL NORTE EN EL PERÍMETRO
      const northAngle = -radHeading - Math.PI / 2;
      const northRadius = 100;
      const nx = CENTER_X + Math.cos(northAngle) * northRadius;
      const ny = CENTER_Y + Math.sin(northAngle) * northRadius;

      ctx.save();
      ctx.translate(nx, ny);
      ctx.rotate(northAngle + Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(0, -6);
      ctx.lineTo(4, 5);
      ctx.lineTo(-4, 5);
      ctx.closePath();
      ctx.fillStyle = theme.uiText;
      ctx.fill();

      ctx.font = "600 8.5px 'IBM Plex Mono', monospace";
      ctx.textAlign = "center";
      ctx.fillText("N", 0, 15);
      ctx.restore();

      // 7. BARRA DE ESCALA GRÁFICA DINÁMICA (con tabular-nums)
      let scaleMeters = 50.0;
      if (currentViewMeters > 13000) {
        scaleMeters = 4000.0;
      } else if (currentViewMeters > 9000) {
        scaleMeters = 3000.0;
      } else if (currentViewMeters > 7000) {
        scaleMeters = 2000.0;
      } else if (currentViewMeters > 3200) {
        scaleMeters = 1000.0;
      } else if (currentViewMeters > 1500) {
        scaleMeters = 500.0;
      } else if (currentViewMeters > 600) {
        scaleMeters = 200.0;
      } else if (currentViewMeters > 380) {
        scaleMeters = 100.0;
      }
      const scaleBarPx = Math.round(scaleMeters * currentPixelsPerMeter);
      const scaleY = SCREEN_H - 10;
      ctx.strokeStyle = theme.uiText;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(12, scaleY);
      ctx.lineTo(12 + scaleBarPx, scaleY);
      ctx.moveTo(12, scaleY - 3);
      ctx.lineTo(12, scaleY + 3);
      ctx.moveTo(12 + scaleBarPx, scaleY - 3);
      ctx.lineTo(12 + scaleBarPx, scaleY + 3);
      ctx.stroke();

      ctx.fillStyle = theme.uiText;
      ctx.font = "500 8px 'IBM Plex Mono', monospace";
      ctx.textAlign = "left";
      const scaleLabel = scaleMeters >= 1000 ? `${Math.round(scaleMeters / 1000)}km` : `${Math.round(scaleMeters)}m`;
      ctx.fillText(scaleLabel, 12 + scaleBarPx + 5, scaleY + 3);

      // 8. INDICADOR VISUAL DEL SLIDER (Control vertical de zoom)
      const sliderOpacity = Math.min(1.0, Math.max(0, (smoothViewMeters - VIEW_METERS_NORMAL) / 80.0));
      if (sliderOpacity > 0.02) {
        ctx.save();
        ctx.globalAlpha = sliderOpacity;
        const trackX = SCREEN_W - 8;
        const trackTop = 40;
        const trackH = 80;
        const trackBottom = trackTop + trackH;

        ctx.strokeStyle = theme.headerBorder;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(trackX, trackTop);
        ctx.lineTo(trackX, trackBottom);
        ctx.moveTo(trackX - 3, trackTop);
        ctx.lineTo(trackX + 3, trackTop);
        ctx.moveTo(trackX - 3, trackBottom);
        ctx.lineTo(trackX + 3, trackBottom);
        ctx.stroke();

        const thumbY = trackTop + smoothDragRatio * trackH;
        ctx.fillStyle = theme.uiText;
        ctx.fillRect(trackX - 3, Math.round(thumbY - 3), 7, 7);

        ctx.font = "500 7.5px 'IBM Plex Mono', monospace";
        ctx.textAlign = "right";
        ctx.fillText(`${Math.round(smoothViewMeters)}m`, trackX - 6, Math.round(thumbY + 2.5));

        ctx.restore();
      }

      requestAnimationFrame(renderOLED);
    }

    // ==========================================
    // CAPTURA DE SENSORES (GPS + GIROSCOPIO)
    // ==========================================
    async function requestOrientationPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          btnGyro.textContent = "solicitando...";
          const response = await DeviceOrientationEvent.requestPermission();
          if (response === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
            window.compasState.gyroActive = true;
            btnGyro.textContent = "activo";
            btnGyro.style.textDecoration = "none";
            btnGyro.onclick = null;
          } else {
            btnGyro.textContent = "denegado";
            btnGyro.style.textDecoration = "none";
          }
        } catch (err) {
          console.warn("Error al solicitar orientación:", err);
          btnGyro.textContent = "error";
        }
      } else if ('ondeviceorientation' in window) {
        window.addEventListener('deviceorientation', handleOrientation, true);
        window.compasState.gyroActive = true;
        btnGyro.textContent = "activo";
        btnGyro.style.textDecoration = "none";
        btnGyro.onclick = null;
      } else {
        btnGyro.textContent = "no soportado";
        btnGyro.style.textDecoration = "none";
      }
    }

    function getCardinal(deg) {
      const directions = ["N", "NE", "E", "SE", "S", "SO", "O", "NO"];
      return directions[Math.round(deg / 45) % 8];
    }

    function handleOrientation(event) {
      let heading = null;

      if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null) {
        heading = event.webkitCompassHeading;
      } else if (event.alpha !== null) {
        heading = (360 - event.alpha) % 360;
      }

      if (heading !== null) {
        window.compasState.heading = heading;
        const card = getCardinal(heading);
        vHeading.textContent = `${Math.round(heading)}° ${card}`;
      }

      if (event.beta !== null && event.gamma !== null) {
        window.compasState.tiltBeta = event.beta;
        window.compasState.tiltGamma = event.gamma;
        const signB = event.beta >= 0 ? "+" : "";
        const signG = event.gamma >= 0 ? "+" : "";
        vTilt.textContent = `${signB}${Math.round(event.beta)}° / ${signG}${Math.round(event.gamma)}°`;
      }
    }

    function initGeolocation() {
      if (!("geolocation" in navigator)) {
        vLat.textContent = "no disponible";
        return;
      }

      navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const acc = pos.coords.accuracy;

          window.compasState.userLat = lat;
          window.compasState.userLon = lon;
          window.compasState.accuracy = acc;
          window.compasState.gpsActive = true;

          if (!originInitialized) {
            MAP_ORIGIN_LAT = lat;
            MAP_ORIGIN_LON = lon;
            METERS_PER_DEG_LON = METERS_PER_DEG_LAT * Math.cos(MAP_ORIGIN_LAT * Math.PI / 180);
            originInitialized = true;

            const isBcn = isInsideBarcelonaArea(lat, lon);
            if (isBcn) {
              loadBarcelonaMasterIfAvailable(lat, lon);
            } else {
              const cachedSegs = loadMapCache(lat, lon);
              if (cachedSegs && cachedSegs.length >= 500) {
                mapSegments = cachedSegs;
                vMapStatus.textContent = `${mapSegments.length} calles (en caché)`;
              } else {
                fetchRealStreetsForLocation(lat, lon);
              }
            }

            const bcn = getBarcelonaDistrictAndBarri(lat, lon);
            if (bcn) {
              const zoneText = `${bcn.dist.toUpperCase()} | ${formatBarriName(bcn.barri)}`;
              window.compasState.districtNeighborhood = zoneText;
              window.compasState.currentDistrict = bcn.dist.toUpperCase();
              window.compasState.currentDistrictKey = normalizeDistrictName(bcn.dist);
              vZone.textContent = zoneText;
            }

            reverseGeocodeRealLocation(lat, lon);
          }

          const coordsInMeters = latLonToMeters(lat, lon);
          window.compasState.userX = coordsInMeters.x;
          window.compasState.userY = coordsInMeters.y;

          if (bcnMasterData && lastSlicedLat !== null) {
            const moveDist = Math.hypot((lat - lastSlicedLat) * 111132, (lon - lastSlicedLon) * 83362);
            if (moveDist > 150) {
              const bcn = getBarcelonaDistrictAndBarri(lat, lon);
              if (bcn) {
                const zoneText = `${bcn.dist.toUpperCase()} | ${formatBarriName(bcn.barri)}`;
                window.compasState.districtNeighborhood = zoneText;
                window.compasState.currentDistrict = bcn.dist.toUpperCase();
                window.compasState.currentDistrictKey = normalizeDistrictName(bcn.dist);
                vZone.textContent = zoneText;
              }
              sliceLocalSegmentsFromMaster(lat, lon);
              if (bcnTopographyData) {
                sliceTopographyFromMaster(lat, lon);
              }
              if (bcnWaterData) {
                sliceWaterFromMaster(lat, lon);
              }
            }
          }

          vLat.textContent = lat.toFixed(6);
          vLon.textContent = lon.toFixed(6);
          vAcc.textContent = `±${Math.round(acc)} m`;
        },
        (err) => {
          console.warn("Error GPS:", err);
          vLat.textContent = "sin señal gps";
        },
        {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        }
      );
    }

    // ==========================================
    // INTERACCIÓN TÁCTIL: ZOOM Y CAMBIO DE TEMA
    // ==========================================
    function startZoom(e) {
      if (e && e.target === btnGyro) return;
      const rect = canvas.getBoundingClientRect();
      const scale = SCREEN_W / rect.width;
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      const x = (cx - rect.left) * scale;
      const y = (cy - rect.top) * scale;

      // Botón superior izquierdo: alternancia de tema claro/oscuro (zona 0-32px X, 0-24px Y)
      if (x >= 0 && x <= 32 && y >= 0 && y <= 24) {
        toggleTheme();
        return;
      }

      isPressing = true;
      touchStartY = cy;
      currentDragY = 0;
    }

    function moveZoom(e) {
      if (!isPressing) return;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      const dy = cy - touchStartY;
      currentDragY = Math.max(0, dy);
    }

    function endZoom() {
      isPressing = false;
      currentDragY = 0;
    }

    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      startZoom(e);
    }, { passive: false });

    window.addEventListener("touchmove", (e) => {
      if (isPressing) {
        moveZoom(e);
      }
    }, { passive: true });

    window.addEventListener("touchend", endZoom);
    window.addEventListener("touchcancel", endZoom);

    canvas.addEventListener("mousedown", (e) => {
      startZoom(e);
    });

    window.addEventListener("mousemove", (e) => {
      if (isPressing) {
        moveZoom(e);
      } else {
        const rect = canvas.getBoundingClientRect();
        const scale = SCREEN_W / rect.width;
        const x = (e.clientX - rect.left) * scale;
        const y = (e.clientY - rect.top) * scale;
        if (x <= 32 && y <= 24) {
          canvas.style.cursor = "pointer";
        } else {
          canvas.style.cursor = "default";
        }
      }
    });

    window.addEventListener("mouseup", endZoom);

    window.addEventListener("DOMContentLoaded", () => {
      initGeolocation();
      requestAnimationFrame(renderOLED);
    });
  </script>
</body>
</html>
