<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COMPAS - Instrumento de Orientación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #EAE3D5;
      color: #2B2A27;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 1rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    body.dark-mode {
      background-color: #0E1A15;
      color: #E8E2D5;
    }

    /* 
      Instrumento de Orientación Cartográfico (256x256 píxeles):
      Optimizado para 60 FPS estables sin saturar el procesador del móvil.
    */
    #oledCanvas {
      width: 270px;
      height: 270px;
      background-color: #F4EFE6;
      display: block;
      border-radius: 4px;
      border: 1px solid #CFC6B4;
      box-shadow: 0 8px 30px rgba(43, 42, 39, 0.10);
      touch-action: none;
      -webkit-touch-callout: none;
      user-select: none;
      cursor: pointer;
      transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    body.dark-mode #oledCanvas {
      background-color: #13221C;
      border-color: #273E34;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    }

    /* Telemetría minimalista centrada en la parte inferior */
    .telemetry {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      font-weight: 400;
      color: #2B2A27;
      line-height: 1.6;
      letter-spacing: -0.01em;
      text-align: center;
      white-space: nowrap;
      width: max-content;
      max-width: 90vw;
      user-select: none;
      transition: color 0.25s ease;
    }

    body.dark-mode .telemetry {
      color: #E8E2D5;
    }

    .telemetry-btn {
      text-decoration: underline;
      cursor: pointer;
      padding: 4px 6px;
    }
  </style>
</head>
<body>

  <!-- Pantalla simulada (256x256 píxeles) -->
  <canvas id="oledCanvas" width="256" height="256"></canvas>

  <!-- Telemetría centrada en la parte inferior -->
  <div class="telemetry">
    <div>lat : <span id="vLat">buscando gps...</span></div>
    <div>lon : <span id="vLon">--</span></div>
    <div>precisión : <span id="vAcc">--</span></div>
    <div>rumbo : <span id="vHeading">--</span></div>
    <div>inclinación : <span id="vTilt">--</span></div>
    <div>calle : <span id="vCurrentStreet">--</span></div>
    <div>zona : <span id="vZone">CONECTANDO GPS...</span></div>
    <div>mapa : <span id="vMapStatus" onclick="forceRefreshMap()" ontouchstart="forceRefreshMap()" style="cursor:pointer; text-decoration:underline;">esperando ubicación...</span> <span style="opacity:0.55; font-size:10px;">(mantén presionado / desliza abajo)</span></div>
    <div>giroscopio : <span id="btnGyro" class="telemetry-btn" onclick="requestOrientationPermission()" ontouchstart="requestOrientationPermission()">activar</span></div>
  </div>

  <!-- COMPAS Arquitectura Modular -->
  <script src="js/config.js"></script>
  <script src="js/label-engine.js"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/controls.js"></script>
</body>
</html>
